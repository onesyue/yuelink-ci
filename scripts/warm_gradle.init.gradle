// Resolve the exact release artifact graph without a release/signing task.
// Init scripts also run for included builds (Flutter's plugin loader is the
// included build ':gradle'), which have no ':app'. Register the task only in
// the top-level Android build so included builds evaluate untouched.
gradle.projectsEvaluated {
    if (gradle.parent != null) {
        return
    }
    def app = gradle.rootProject.findProject(':app')
    if (app == null) {
        throw new GradleException('warmDependencyCache: top-level build has no :app project')
    }
    app.tasks.register('warmDependencyCache') {
        doLast {
            ['releaseCompileClasspath', 'releaseRuntimeClasspath'].each { name ->
                def configuration = app.configurations.getByName(name)
                if (!configuration.canBeResolved) {
                    throw new GradleException("Cannot resolve ${name}")
                }
                // Warm only external modules. Resolving Android library *project*
                // variants (e.g. :android_file_picker) without an artifactType is
                // ambiguous and failed run 43434250452; they are built, not cached.
                configuration.incoming.artifactView {
                    componentFilter { it instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier }
                    lenient false
                }.files.files
            }
        }
    }
}

name: Diagnose Windows media
run-name: Verify signed Windows scaler LUT repair

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        lane: [1, 2, 3]
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    steps:
      - name: Checkout diagnostic driver
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: diagnostic
          persist-credentials: false

      - name: Checkout exact signed native repair candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: onesyue/yuelink
          ref: e2a3763232a4b1c6baaddede3e098101d996e047
          ssh-key: ${{ secrets.SRC_DEPLOY_KEY }}
          path: source
          persist-credentials: false

      - name: Check source identity and locked native library bytes
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = e2a3763232a4b1c6baaddede3e098101d996e047
          python3 scripts/native_tests/windows_media/verify.py

      - name: Compile and compare bounded media probes
        shell: bash
        env:
          DIAGNOSTIC_LANE: ${{ matrix.lane }}
        run: python3 diagnostic/scripts/diagnose-windows-media.py source "$RUNNER_TEMP/windows-media-diagnostic"

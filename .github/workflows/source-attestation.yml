name: Diagnose Windows media
run-name: Diagnose signed v1.3.109 Windows media

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    steps:
      - name: Checkout diagnostic driver
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: diagnostic
          persist-credentials: false

      - name: Checkout exact previously attested source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: onesyue/yuelink
          ref: 5fa1621a39599d271d846be40f595ba5c1e42aa4
          ssh-key: ${{ secrets.SRC_DEPLOY_KEY }}
          path: source
          persist-credentials: false

      - name: Check source identity and locked native library bytes
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 5fa1621a39599d271d846be40f595ba5c1e42aa4
          python3 scripts/native_tests/windows_media/verify.py

      - name: Compile and compare bounded media probes
        shell: bash
        run: python3 diagnostic/scripts/diagnose-windows-media.py source "$RUNNER_TEMP/windows-media-diagnostic"

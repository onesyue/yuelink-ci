name: Policy CI

on:
  pull_request: {}
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  manifest_contract:
    name: Updater manifest trust contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Run offline policy regression suites
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      # Same pinned actionlint as yueto-ci policy-ci (reviewed version + the
      # release's linux_amd64 sha256). It also runs ShellCheck over every
      # `run:` block; the second command covers the repo's own *.sh.
      - name: Lint workflows and shell scripts
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_ARCHIVE_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          destination="$RUNNER_TEMP/actionlint-bin"
          curl --fail --silent --show-error --location \
            --retry 4 --retry-all-errors --retry-delay 2 \
            --proto '=https' --tlsv1.2 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$ACTIONLINT_ARCHIVE_SHA256" "$archive" \
            | sha256sum --check --strict
          mkdir -p "$destination"
          tar --extract --gzip --file "$archive" --directory "$destination" actionlint
          command -v shellcheck
          "$destination/actionlint" .github/workflows/*.yml
          shellcheck --severity=warning ./*.sh scripts/*.sh

      - name: Verify current live signed manifest
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          trap 'rm -f -- "$tmp"' EXIT
          curl --fail --location --silent --show-error \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --connect-timeout 5 --max-time 30 \
            --retry 2 --retry-all-errors \
            https://yuetong.app/update.json -o "$tmp"
          python3 scripts/verify-update-manifest.py "$tmp"

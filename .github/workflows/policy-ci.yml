name: Policy CI

on:
  pull_request: {}
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      yuelink_sha:
        description: Exact yuelink PR commit SHA to validate (optional)
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  MANIFEST_CONNECT_SECONDS: '5'
  MANIFEST_FETCH_SECONDS: '30'
  MANIFEST_FETCH_RETRIES: '2'

jobs:
  manifest_contract:
    name: Updater manifest trust contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Anti-freeze compares the baseline with the master merge-base.
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned actionlint
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_ARCHIVE_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          destination="$RUNNER_TEMP/actionlint-bin"
          curl --fail --silent --show-error --location \
            --retry 4 --retry-all-errors --retry-delay 2 \
            --proto '=https' --tlsv1.2 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$ACTIONLINT_ARCHIVE_SHA256" "$archive" \
            | sha256sum --check --strict
          mkdir -p "$destination"
          tar --extract --gzip --file "$archive" --directory "$destination" actionlint
          echo "$destination" >> "$GITHUB_PATH"

      - name: Install policy test dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/policy-tests"
          "$RUNNER_TEMP/policy-tests/bin/python" -m pip install 'PyYAML==6.0.3'
          echo "$RUNNER_TEMP/policy-tests/bin" >> "$GITHUB_PATH"

      - name: Run offline policy checks
        run: scripts/check-policy.sh ci

      - name: Verify current live signed manifest
        run: |
          set -euo pipefail
          manifest_url="$(python3 scripts/brand_literals.py URL_UPDATE_MANIFEST)"
          tmp="$(mktemp)"
          trap 'rm -f -- "$tmp"' EXIT
          curl --fail --location --silent --show-error \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --connect-timeout "$MANIFEST_CONNECT_SECONDS" --max-time "$MANIFEST_FETCH_SECONDS" \
            --retry "$MANIFEST_FETCH_RETRIES" --retry-all-errors \
            "$manifest_url" -o "$tmp"
          python3 scripts/verify-update-manifest.py "$tmp"

  source_version:
    name: YueLink source version gate
    if: github.event_name == 'workflow_dispatch' && inputs.yuelink_sha != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate exact source input
        env:
          SOURCE_SHA: ${{ inputs.yuelink_sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
      - name: Checkout requested YueLink commit and release tags
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: onesyue/yuelink
          ref: ${{ inputs.yuelink_sha }}
          ssh-key: ${{ secrets.SRC_DEPLOY_KEY }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require version bump for shipped source changes
        run: bash scripts/check-version-bump.sh --ref HEAD
      - name: Test version gate failure paths
        run: python3 -m unittest discover -s scripts -p test_version_gate.py -v

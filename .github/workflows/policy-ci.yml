name: Policy CI

on:
  pull_request: {}
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  manifest_contract:
    name: Updater manifest trust contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Run offline signature regression suite
        run: python3 -m unittest -v tests/test_update_manifest_verifier.py

      - name: Verify current live signed manifest
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          trap 'rm -f -- "$tmp"' EXIT
          curl --fail --location --silent --show-error \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --connect-timeout 5 --max-time 30 \
            --retry 2 --retry-all-errors \
            https://yuetong.app/update.json -o "$tmp"
          python3 scripts/verify-update-manifest.py "$tmp"

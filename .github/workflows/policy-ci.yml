name: Policy CI

on:
  pull_request: {}
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  manifest_contract:
    name: Updater manifest trust contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run offline policy regression suites
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Verify current live signed manifest
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          trap 'rm -f -- "$tmp"' EXIT
          curl --fail --location --silent --show-error \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --connect-timeout 5 --max-time 30 \
            --retry 2 --retry-all-errors \
            https://yuetong.app/update.json -o "$tmp"
          python3 scripts/verify-update-manifest.py "$tmp"

name: Flutter teardown diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, binding, no-coverage]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: onesyue/yuelink
          ref: 4ee477290d77bcbbc1c5112c4d04e134b0005d49
          ssh-key: ${{ secrets.SRC_DEPLOY_KEY }}
          persist-credentials: false
      - uses: onesyue/yuelink-ci/.github/actions/setup-flutter@25d71e2ab4d5c16695e569c6011ddbdc66ab221f # pinned installer v1
        with:
          flutter-version: '3.47.7'
          cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: yue-pub-v1-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
      - run: flutter pub get --enforce-lockfile
      - name: Reproduce exact failing files in an isolated checkout
        env:
          VARIANT: ${{ matrix.variant }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostic
          git rev-parse HEAD > diagnostic/source.txt
          flutter --version --machine > diagnostic/sdk.json
          if [ "$VARIANT" = binding ]; then
            python3 - <<'PY'
          from pathlib import Path
          for name in ('user_custom_rules_test.dart', 'subscription_parser_test.dart'):
              path = Path('test/services') / name
              text = path.read_text()
              assert text.count('void main() {') == 1
              path.write_text(text.replace('void main() {', 'void main() {\n  TestWidgetsFlutterBinding.ensureInitialized();'))
          PY
            git diff > diagnostic/binding.patch
          fi
          flags=(--coverage)
          if [ "$VARIANT" = no-coverage ]; then flags=(); fi
          timeout --signal=TERM --kill-after=10s 180 \
            flutter test --no-pub "${flags[@]}" --machine --concurrency=1 \
            test/services/user_custom_rules_test.dart \
            test/services/subscription_parser_test.dart \
            2>&1 | tee diagnostic/tests.jsonl
      - name: Preserve diagnostic evidence without publishing a release
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flutter-teardown-${{ matrix.variant }}
          path: diagnostic/
          if-no-files-found: error

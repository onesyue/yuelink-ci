name: Audit immutable R2 releases

# Historical filename retained so existing workflow_run wiring and bookmarks do
# not break. Since 2026-08-21, every object below the `v` prefix is protected by
# the indefinite Cloudflare bucket-lock rule
# `yuelink-release-versioned-indefinite`. Versioned release evidence is a
# permanent supply-chain record: this workflow is read-only and must never
# delete, overwrite, copy-to, or otherwise mutate a v*/ release object.
#
# There is currently no designated ephemeral R2 namespace. If one is added, it
# needs a separate explicit prefix/age/owner contract and must remain outside
# both the locked `v` and `security/` namespaces; it is not implicitly eligible
# for cleanup here.

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] no upstream artifacts/code; exact run identity + pinned verifier + signed R2 roots
    workflows: ["Build YueLink"]
    types: [completed]
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Keep the historical group name to serialize schedule/manual/workflow_run
# audits. No bucket mutation occurs, but a single report is easier to review.
concurrency:
  group: yuelink-r2-prune
  cancel-in-progress: false

jobs:
  audit:
    name: Audit permanent versioned releases
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Validate trusted Build workflow_run identity
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY: ${{ github.event.workflow_run.repository.full_name }}
          SOURCE_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          SOURCE_EVENT: ${{ github.event.workflow_run.event }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_WORKFLOW_PATH: ${{ github.event.workflow_run.path }}
        run: |
          set -euo pipefail
          [ "$SOURCE_REPOSITORY" = "$GITHUB_REPOSITORY" ] || {
            echo "::error::workflow_run repository is not $GITHUB_REPOSITORY"
            exit 1
          }
          [ "$SOURCE_HEAD_REPOSITORY" = "$GITHUB_REPOSITORY" ] || {
            echo "::error::workflow_run head repository is not $GITHUB_REPOSITORY"
            exit 1
          }
          case "$SOURCE_EVENT" in
            push|workflow_dispatch) ;;
            *) echo "::error::unexpected Build source event: $SOURCE_EVENT"; exit 1 ;;
          esac
          [ "$SOURCE_CONCLUSION" = success ] || {
            echo "::error::Build workflow did not conclude successfully"
            exit 1
          }
          [ "$SOURCE_WORKFLOW_PATH" = .github/workflows/build.yml ] || {
            echo "::error::unexpected source workflow path: $SOURCE_WORKFLOW_PATH"
            exit 1
          }
          [[ "$SOURCE_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Build head SHA is not a full lowercase commit id"
            exit 1
          }
          resolved="$(
            gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_HEAD_SHA" --jq .sha
          )"
          [ "$resolved" = "$SOURCE_HEAD_SHA" ] || {
            echo "::error::Build head SHA is not a commit in $GITHUB_REPOSITORY"
            exit 1
          }

      - name: Checkout pinned manifest verifier
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Audit live lock and permanent release archive
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_APP_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_CONFIG_TOKEN }}
          R2_ACCOUNT_ID: 1e192a89cfaab399d211bb1dfe77a5cd
          R2_ENDPOINT: https://1e192a89cfaab399d211bb1dfe77a5cd.r2.cloudflarestorage.com
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          BUCKET: yuelink-dist
          LOCK_RULE_ID: yuelink-release-versioned-indefinite
        run: |
          set -euo pipefail
          for required in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY CLOUDFLARE_API_TOKEN; do
            [ -n "${!required:-}" ] || {
              echo "::error::$required is required for the immutable R2 audit"
              exit 1
            }
          done
          for command_name in aws curl jq python3; do
            command -v "$command_name" >/dev/null 2>&1 || {
              echo "::error::missing audit command: $command_name"
              exit 1
            }
          done

          audit_dir="$(mktemp -d)"
          chmod 700 "$audit_dir"
          trap 'rm -rf "$audit_dir"' EXIT
          root_manifest="$audit_dir/update.json"
          archive_manifest="$audit_dir/archive.json"
          lock_response="$audit_dir/lock.json"
          prefixes="$audit_dir/version-prefixes.txt"

          aws s3 cp "s3://$BUCKET/update.json" "$root_manifest" \
            --endpoint-url "$R2_ENDPOINT" --no-progress --only-show-errors
          python3 scripts/verify-update-manifest.py "$root_manifest"
          current_version="$(jq -er '.version | select(type == "string")' "$root_manifest")"
          [[ "$current_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::signed root does not contain a stable SemVer"
            exit 1
          }
          current_prefix="v$current_version"

          curl --fail --silent --show-error \
            --proto '=https' --tlsv1.2 \
            --connect-timeout 10 --max-time 30 \
            --retry 2 --retry-all-errors --retry-max-time 30 \
            --max-redirs 0 --max-filesize 262144 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --output "$lock_response" \
            "https://api.cloudflare.com/client/v4/accounts/$R2_ACCOUNT_ID/r2/buckets/$BUCKET/lock"
          jq -e --arg id "$LOCK_RULE_ID" --arg target "$current_prefix/" '
            .success == true and (.errors | length) == 0 and
            ([.result.rules[]? |
              select(
                .id == $id and .enabled == true and .prefix == "v" and
                .condition.type == "Indefinite" and
                (.prefix as $prefix | $target | startswith($prefix))
              )] | length) == 1
          ' "$lock_response" >/dev/null || {
            echo "::error::required live R2 lock is missing or changed: $LOCK_RULE_ID prefix=v type=Indefinite enabled=true"
            exit 1
          }

          aws s3 cp "s3://$BUCKET/$current_prefix/update.json" "$archive_manifest" \
            --endpoint-url "$R2_ENDPOINT" --no-progress --only-show-errors
          python3 scripts/verify-update-manifest.py \
            --historical-archive "$archive_manifest"
          cmp -s "$root_manifest" "$archive_manifest" || {
            echo "::error::root update.json differs from permanent $current_prefix archive"
            exit 1
          }

          aws s3 ls "s3://$BUCKET/" --endpoint-url "$R2_ENDPOINT" \
            | awk '/ PRE /{print $2}' | sed 's#/##' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-pre(\.[0-9]+)?)?$' \
            | sort -V > "$prefixes" || true
          grep -qx "$current_prefix" "$prefixes" || {
            echo "::error::current permanent release prefix is absent from the bucket inventory"
            exit 1
          }

          inventory="$(aws s3 ls "s3://$BUCKET/v" --recursive --summarize \
            --endpoint-url "$R2_ENDPOINT" 2>/dev/null)"
          object_count="$(awk '/Total Objects:/{print $3}' <<<"$inventory")"
          byte_count="$(awk '/Total Size:/{print $3}' <<<"$inventory")"
          object_count="${object_count:-0}"
          byte_count="${byte_count:-0}"
          prefix_count="$(grep -c . "$prefixes" || true)"
          gib="$(awk "BEGIN{printf \"%.2f\", $byte_count/1024/1024/1024}")"

          {
            echo "### Permanent R2 release archive"
            echo
            echo "- Lock: \`$LOCK_RULE_ID\` (enabled, prefix \`v\`, indefinite)"
            echo "- Current signed root/archive: \`$current_prefix\`"
            echo "- Version prefixes: $prefix_count"
            echo "- Versioned objects: $object_count"
            echo "- Versioned bytes: $byte_count (${gib} GiB)"
            echo "- Mutation: none; all \`v*/\` release evidence is retained permanently"
          } | tee -a "$GITHUB_STEP_SUMMARY"

          echo "✓ immutable R2 audit complete; no release object was mutated"

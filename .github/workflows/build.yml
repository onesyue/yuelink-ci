name: Build YueLink

# ┌───────────────────────────────────────────────────────────────────────┐
# │ PUBLIC CI MIRROR — 本仓不含源码。源码在私有 onesyue/yuelink。见 README。         │
# │ 触发：signed tag 绑定 source SHA → checkout 私有仓 exact commit。产物进 R2。 │
# └───────────────────────────────────────────────────────────────────────┘
#
# Release builds. One matrix job covers every platform; release downloads
# all artifacts in one shot. Modeled after FlClash's build.yaml — same
# 3-job shape (build → release candidate → private signer), one matrix row per
# target. This public builder never receives the updater-manifest private key.
#
# Triggers:
#   • vX.Y.Z signed tag → stable release
#   • every non-stable tag is rejected before source/R2 access
#   • workflow_dispatch
#   • pull_request runs only the dial gate; release jobs stay on signed tags
#
# Analyze + integration tests live in ci.yml (master/PR/manual). The release
# preflight below independently re-runs every hard gate, so a tag cannot race
# or bypass a sibling workflow.

# The plan, validate, build and publish stages are reusable workflows in
# this directory. Dial jobs stay here: five platforms, strict summary.
# A called workflow sees this run's github context. secrets: inherit keeps
# the existing secret boundary. Do not dispatch a preview from this split.
on:
  pull_request:
  push:
    # GitHub's tag filter is only the coarse trigger. source_binding below
    # enforces exact stable vX.Y.Z syntax before querying source evidence.
    tags: ['v*']
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact attested private source commit (40 lowercase hex)'
        required: true
        type: string
      only:
        description: '只构建某平台(测试用,正式发版 tag 触发恒为全平台)'
        type: choice
        default: all
        options: [all, android, ios, macos, windows, linux]
      dialgate_candidate_ref:
        description: 'Optional yuelink ref for the dial-gate candidate'
        required: false
        type: string

concurrency:
  # Tags and manual runs share one queue. A pull request uses its own
  # group so the dial gate does not block a release.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  # A second tag queues behind the first. Cancelling a production build can
  # leave only some immutable R2 artifacts/candidate inputs; the separate
  # private signer has its own monotonic root-promotion guard.
  cancel-in-progress: false

# Least-privilege default. Build jobs add OIDC only for provenance;
# R2 publication does not need repository write permission. Adding the
# top-level block doesn't change behavior for jobs that already declare
# their own `permissions:`; it only narrows the floor for jobs that
# don't.
permissions:
  contents: read

env:
  # Private template fallback only; public runs use their exact builder SHA.
  COVERAGE_TOOLS_SHA: '07856de8be832ceed6e4daeff7bf840c2269d8dc'
  # Flutter 3.47.8 / Dart 3.13.7 (2026-10-23): BoringSSL distrusts the
  # compromised eMudhra intermediates (GHSA-frr6-h895-5pxp) and Android 14+
  # reads the updatable Conscrypt root store. Embedder renderer files are
  # unchanged from 3.47.7. Exact archives are verified by setup-flutter.
  FLUTTER_VERSION: '3.47.8'
  # Go 1.27.1 (2026-09-01): 跨 minor 从 1.26.8 升上来，与 yue-node/Xray-core
  # fork 的发布工具链对齐。拿到 1.27 的小对象分配优化（<80B 分配路径约 -30%，
  # 分配密集程序整体约 1%）；Green Tea GC 在 1.26 就已默认、不是本次新增。
  #
  # 跨 minor 此前是一道**人工门**（"升之前先核 metacubex/gvisor 的 linkname 假设"），
  # 因为 gvisor fork 在 amd64 上按写死的偏移直接改 runtime.sched.nmspinning，
  # 失配不报编译错误、只在运行期把调度器计数器写坏。2026-09-20 起该门由
  # core/gvisor_runtime_abi_test.go 自动执行：它用当前工具链真实编译出的 DWARF
  # 布局，对上 gvisor fork 里写死的 NMSPINNING_OFFSET 与 WaitReason 字面量。
  # 升级时实测：nmspinning 偏移在 linux/windows/darwin ×amd64 下 1.26.8 与 1.27.1
  # 均为 116、schedt 大小同为 6872；三个 WaitReason 常量两版一致；
  # 对照 1.25.0=100 / 1.24.0=92 证明该判据确实会随版本变动。
  # Keep the release builder and govulncheck on this exact patch release;
  # a floating 1.27 selector can silently rebuild the same tag against a
  # different standard library.
  # 2026-10-21: Go 1.27.3 addresses GO-2026-6809; retain the shipped-toolchain ABI guard.
  # 2026-11-11: Go 1.27.4 addresses GO-2026-6859 (net/http MaxBytesReader race).
  GO_VERSION: '1.27.4'
  # Production builds consume the reviewed module graph exactly. `core/go.mod`
  # and go.sum are tidy against the pinned mihomo submodule; dependency drift
  # must fail the build instead of being resolved implicitly on a runner.
  GOFLAGS: -mod=readonly
  # Opt JS actions (actions/attest*, etc.) into Node.js 24 now, ahead of the
  # 2026-06-16 forced default — silences the recurring Node 20 deprecation
  # warning. Safe to drop once Node 24 is the runner default.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  plan:
    name: Plan
    if: github.event_name != 'pull_request'
    permissions:
      actions: read
      attestations: read
      contents: read
    uses: ./.github/workflows/plan.yml
    with:
      only: ${{ github.event.inputs.only }}
      source_sha: ${{ inputs.source_sha }}
    secrets: inherit

  validate:
    name: Validate
    needs: [plan]
    if: github.event_name != 'pull_request'
    permissions:
      actions: read
      attestations: read
      contents: read
    uses: ./.github/workflows/validate.yml
    with:
      source_commit: ${{ needs.plan.outputs.source_commit }}
      attestation_run_id: ${{ needs.plan.outputs.attestation_run_id }}
    secrets: inherit

  build:
    name: Build
    needs: [plan, validate]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-matrix.yml
    with:
      source_commit: ${{ needs.plan.outputs.source_commit }}
      matrix: ${{ needs.plan.outputs.matrix }}
    secrets: inherit

  publish:
    name: Publish
    needs: [plan, build, validate, dial_gate, dial_gate_summary]
    # Tag-only guard. A branch dispatch must not publish. A failed build still
    # reaches this job; promotion requires plan, validate and both dial jobs.
    if: >-
      always() &&
      startsWith(github.ref, 'refs/tags/') &&
      needs.plan.result == 'success' &&
      needs.validate.result == 'success' &&
      needs.dial_gate.result == 'success' &&
      needs.dial_gate_summary.result == 'success'
    permissions:
      contents: write
      actions: read
      attestations: read
    uses: ./.github/workflows/publish.yml
    with:
      source_commit: ${{ needs.plan.outputs.source_commit }}
      attestation_run_id: ${{ needs.plan.outputs.attestation_run_id }}
      tag_kind: ${{ needs.validate.outputs.tag_kind }}
    secrets: inherit


  # ───────────────────────────────────────────────────────────────────────────
  # 2026-08-21: Cloudflare bucket lock permanently protects every object below
  # prefix `v`. The mirror's historical prune-r2.yml is now a read-only lock /
  # signed-archive audit. No release prefix is deleted or overwritten; storage
  # growth is an intentional supply-chain retention decision.
  # ───────────────────────────────────────────────────────────────────────────

  # Real dial gate. Loopback sing-box only. The release job will not promote
  # unless every platform passes. iOS runs the kernel with simctl spawn and
  # does not start NetworkExtension. Task 33's layout check and Windows TFO
  # echo test run at the start of this job; there is no second gate.
  dial_gate:
    name: Dial gate
    needs: [plan]
    permissions:
      contents: read
      actions: write
      attestations: read
    if: >-
      always() &&
      (github.event_name == 'pull_request' || needs.plan.result == 'success')
    uses: ./.github/workflows/dial-gate.yml
    with:
      candidate_ref: ${{ github.event.inputs.dialgate_candidate_ref || (github.event_name == 'pull_request' && '54c846ae35cae41d7549762881c10519788347f3') || needs.plan.outputs.source_commit }}
      run_pr_checks: ${{ github.event_name == 'pull_request' }}
    secrets:
      SRC_DEPLOY_KEY: ${{ secrets.SRC_DEPLOY_KEY }}


  dial_gate_summary:
    name: Dial gate table
    needs: [plan, dial_gate]
    if: >-
      always() &&
      needs.dial_gate.result != 'cancelled' &&
      (github.event_name == 'pull_request' || needs.plan.result == 'success')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: dial-gate-*
          path: dial-reports
      - name: Write the platform table
        env:
          EXPECTED_SOURCE_COMMIT: ${{ needs.plan.outputs.source_commit }}
          EXPECTED_BASELINE_SOURCE: ${{ needs.dial_gate.outputs.baseline_source }}
          REQUIRE_SOURCE_COMMIT: ${{ github.event_name != 'pull_request' }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, sys
          from pathlib import Path
          want = ["windows", "macos", "linux", "android", "ios"]
          protocols = {"vless-reality-tfo", "vless-reality", "vless-ws-tls", "hysteria2"}
          found = {}
          identities = None
          expected_baseline = os.environ.get("EXPECTED_BASELINE_SOURCE", "")
          if not re.fullmatch(r"[0-9a-f]{40}", expected_baseline):
              sys.exit("missing or invalid frozen dial baseline")
          expected_source = os.environ.get("EXPECTED_SOURCE_COMMIT", "")
          if os.environ.get("REQUIRE_SOURCE_COMMIT") != "false" and not re.fullmatch(r"[0-9a-f]{40}", expected_source):
              sys.exit("missing or invalid planned release source")
          for path in Path("dial-reports").glob("*/gate.json"):
              data = json.loads(path.read_text())
              platform = data.get("platform")
              if platform not in want or path.parent.name != f"dial-gate-{platform}" or platform in found:
                  sys.exit("invalid or duplicate dial-gate platform evidence")
              for field, expected in (("schema_version", 2), ("rounds", 5), ("samples_per_round", 20), ("warmup", 1)):
                  if type(data.get(field)) is not int or data[field] != expected:
                      sys.exit(f"invalid fixed-round metadata for {platform}")
              identity = []
              for role in ("baseline", "candidate"):
                  source = data.get(role)
                  if not isinstance(source, dict):
                      sys.exit(f"missing source identity for {platform}")
                  for field in ("revision", "core_revision"):
                      value = source.get(field)
                      if not isinstance(value, str) or not re.fullmatch(r"[0-9a-f]{40}", value):
                          sys.exit(f"invalid source identity for {platform}")
                      identity.append(value)
              if data["baseline"]["revision"] != expected_baseline:
                  sys.exit(f"baseline differs from frozen promoted source for {platform}")
              harness = data.get("harness_revision")
              if harness != data["candidate"]["revision"]:
                  sys.exit(f"mismatched measurement harness for {platform}")
              if expected_source and data["candidate"]["revision"] != expected_source:
                  sys.exit(f"candidate differs from planned source for {platform}")
              if data.get("go_version") != "go" + os.environ["GO_VERSION"] or data.get("build_tags") != "with_gvisor":
                  sys.exit(f"mismatched measurement toolchain for {platform}")
              identity.extend((harness, data["go_version"], data["build_tags"]))
              if identities is not None and identity != identities:
                  sys.exit("source identities differ across platforms")
              identities = identity
              rows = data.get("rows")
              if not isinstance(rows, list) or len(rows) != len(protocols):
                  sys.exit(f"incomplete protocol evidence for {platform}")
              if any(not isinstance(row, dict) for row in rows):
                  sys.exit(f"invalid protocol evidence for {platform}")
              if {row.get("protocol") for row in rows} != protocols:
                  sys.exit(f"missing, unknown or duplicate protocols for {platform}")
              if type(data.get("pass")) is not bool:
                  sys.exit(f"invalid platform verdict for {platform}")
              for row in rows:
                  if type(row.get("pass")) is not bool:
                      sys.exit(f"invalid protocol verdict for {platform}")
                  for field in ("baseline_samples", "candidate_samples"):
                      if type(row.get(field)) is not int or row[field] != 100:
                          sys.exit(f"insufficient dial samples for {platform}")
                  rounds = row.get("rounds")
                  if not isinstance(rounds, list) or len(rounds) != 5:
                      sys.exit(f"incomplete dial rounds for {platform}")
                  seen = set()
                  for item in rounds:
                      if not isinstance(item, dict) or type(item.get("round")) is not int:
                          sys.exit(f"invalid dial round for {platform}")
                      index = item["round"]
                      if index not in range(5) or index in seen:
                          sys.exit(f"duplicate or invalid dial round for {platform}")
                      seen.add(index)
                      for field in ("baseline_samples", "candidate_samples"):
                          if type(item.get(field)) is not int or item[field] != 20:
                              sys.exit(f"incomplete dial round samples for {platform}")
                      if item.get("success_pass") is not True:
                          sys.exit(f"failed dial round success gate for {platform}")
              found[platform] = data
          lines = ["| platform | protocol | baseline | candidate | baseline p95 ms | candidate p95 ms | pass |",
                   "|---|---|---:|---:|---:|---:|:---:|"]
          ok = True
          for platform in want:
              data = found.get(platform)
              if data is None:
                  ok = False
                  lines.append(f"| {platform} | missing | | | | | FAIL |")
                  continue
              if not data.get("pass"):
                  ok = False
              for row in data.get("rows", []):
                  def rate(value, n_ok, n):
                      if not n:
                          return "n/a"
                      return f"{value:.2f} ({n_ok}/{n})"
                  def ms(value):
                      return "n/a" if value is None else f"{value:.1f}"
                  mark = "pass" if row.get("pass") else "FAIL"
                  if not row.get("pass"):
                      ok = False
                  lines.append(
                      "| {platform} | {protocol} | {b} | {c} | {bp} | {cp} | {mark} |".format(
                          platform=platform,
                          protocol=row.get("protocol", ""),
                          b=rate(row.get("baseline_success_rate") or 0, row.get("baseline_ok") or 0, row.get("baseline_samples") or 0),
                          c=rate(row.get("candidate_success_rate") or 0, row.get("candidate_ok") or 0, row.get("candidate_samples") or 0),
                          bp=ms(row.get("baseline_p95_ms")),
                          cp=ms(row.get("candidate_p95_ms")),
                          mark=mark,
                      )
                  )
          table = "\n".join(lines) + "\n"
          print(table)
          path = os.environ.get("GITHUB_STEP_SUMMARY")
          if path:
              with open(path, "a", encoding="utf-8") as fh:
                  fh.write("### Real dial gate\n\n")
                  fh.write("iOS is the kernel inside the simulator. NetworkExtension is not started.\n\n")
                  fh.write(table)
          if not ok:
              sys.exit(1)
          PY

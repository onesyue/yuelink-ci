# Generated by scripts/generate-dialgate-verify.py; edit the generator/template.
name: YueLink dial verification

on:
  pull_request:
    paths:
      - '.github/workflows/build.yml'
      - '.github/workflows/dialgate-verify.yml'
      - 'policy/dialgate-source.json'
      - 'scripts/*dial*'
      - 'sync-build.sh'
      - 'tests/test_dial*'
  workflow_dispatch:
    inputs:
      source_pr:
        description: 'Private YueLink PR number (for example 113)'
        required: true
        type: string
      ios_compile_mode:
        description: 'positive source or separately signed missing-argument fixture (keeps compile check red)'
        required: false
        type: choice
        default: positive
        options: [positive, negative]
      verification_scope:
        description: 'full suite or explicitly iOS-only; neither bypasses release gates'
        required: false
        type: choice
        default: full
        options: [full, ios-only]
      source_sha:
        description: 'Exact reviewed private PR head (40 lowercase hex)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: dial-verification-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: '1.27.4'
  FLUTTER_VERSION: '3.47.8'

jobs:
  dial_source_binding:
    name: Bind reviewed private PR snapshot
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      candidate_commit: ${{ steps.inputs.outputs.candidate_commit }}
      baseline_commit: 576460aedc31690b85ccb529f519a43024e19930
      source_pr: ${{ steps.inputs.outputs.source_pr }}
      ios_compile_mode: ${{ steps.inputs.outputs.ios_compile_mode }}
      verification_scope: ${{ steps.inputs.outputs.verification_scope }}
    steps:
      - name: Checkout exact public verifier and reviewed source manifest
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate verification inputs
        id: inputs
        run: python3 scripts/dialgate-binding.py inputs
      - name: Resolve private PR head without executing source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: onesyue/yuelink
          ref: refs/pull/${{ steps.inputs.outputs.source_pr }}/head
          ssh-key: ${{ secrets.SRC_DEPLOY_KEY }}
          path: bound-source
          fetch-depth: 1
          persist-credentials: false
      - name: Require reviewed source identity and removed checkout credentials
        env:
          EXPECTED_CANDIDATE: ${{ steps.inputs.outputs.candidate_commit }}
        run: python3 scripts/dialgate-binding.py confirm --checkout bound-source --expected "$EXPECTED_CANDIDATE"

  linux_client_tests:
    name: Linux scoped client regression tests
    needs: [dial_source_binding]
    if: needs.dial_source_binding.result == 'success' && needs.dial_source_binding.outputs.ios_compile_mode == 'positive' && needs.dial_source_binding.outputs.verification_scope == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TZ: UTC
    defaults:
      run:
        working-directory: candidate
    steps:
      - name: Checkout exact public verifier tools
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: .client-verifier
          persist-credentials: false
      - name: Checkout bound client test candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: onesyue/yuelink
          ref: ${{ needs.dial_source_binding.outputs.candidate_commit }}
          ssh-key: ${{ secrets.SRC_DEPLOY_KEY }}
          path: candidate
          submodules: recursive
          persist-credentials: false
      - name: Confirm client test source identity
        env:
          EXPECTED_CANDIDATE: ${{ needs.dial_source_binding.outputs.candidate_commit }}
        run: python3 ../.client-verifier/scripts/dialgate-binding.py confirm --checkout . --expected "$EXPECTED_CANDIDATE"
      - name: Test device wrappers with offline mocks
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/test_dialgate_device_wrappers.py 2>&1 | tee "$RUNNER_TEMP/linux-device-wrapper-tests.log"
      - name: Set up canonical Go regression toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Run exact-candidate dialgate Go regressions
        working-directory: candidate/core
        shell: bash
        env:
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          # The default build does not import gVisor; ABI guards inspect its sources.
          go mod download github.com/metacubex/gvisor
          go test -p 2 ./dialgate/... 2>&1 | tee "$RUNNER_TEMP/linux-dialgate-go-tests.log"
          go test -race -p 2 ./recovery . 2>&1 | tee -a "$RUNNER_TEMP/linux-dialgate-go-tests.log"
          go test -tags with_gvisor -p 2 ./dialgate/... 2>&1 | tee -a "$RUNNER_TEMP/linux-dialgate-go-tests.log"
          go test -tags with_gvisor -race -p 2 ./recovery . 2>&1 | tee -a "$RUNNER_TEMP/linux-dialgate-go-tests.log"
      - name: Set up reviewed Flutter SDK
        uses: onesyue/yuelink-ci/.github/actions/setup-flutter@d6c9eb965b79818ed944b3e2df168905b535ff49 # pinned installer v1
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Resolve locked client test dependencies
        run: flutter pub get --enforce-lockfile
      - name: Run archive and authenticated policy workflow contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/policy-venv"
          "$RUNNER_TEMP/policy-venv/bin/pip" install 'PyYAML==6.0.3'
          python3 scripts/ci/test_pipeline_archive_modes.py 2>&1 | tee "$RUNNER_TEMP/linux-archive-tests.log"
          "$RUNNER_TEMP/policy-venv/bin/python" scripts/ci/test_candidate_policy_workflow.py             --builder "$GITHUB_WORKSPACE/.client-verifier" 2>&1 | tee "$RUNNER_TEMP/linux-policy-workflow-tests.log"
      - name: Run scoped Linux client tests
        shell: bash
        run: |
          set -euo pipefail
          flutter test --no-pub --concurrency=2 \
            test/modules/updater \
            test/services/update_checker_test.dart \
            test/automation/macos_manifest_floor_test.dart \
            test/automation/prepare_manifest_rollback_test.dart \
            test/modules/force_upgrade_dialog_test.dart \
            test/modules/force_upgrade_launch_contract_20260926_test.dart \
            test/services/update_manifest_compatibility_test.dart \
            test/shared/crash_frame_privacy_20261111_test.dart \
            test/shared/error_logger_test.dart \
            test/shared/error_logger_context_20261006_test.dart \
            test/infrastructure \
            test/core/kernel/config/config_parse_soft_fail_test.dart \
            test/services/config_template_test.dart \
            test/automation/workflow_guard_test.dart \
            test/core/api/recovery_probe_api_test.dart \
            test/modules/smart_select_cached_delay_test.dart \
            test/modules/smart_select_and_quota_test.dart \
            test/modules/smart_select_cross_protocol_test.dart \
            test/modules/dashboard \
            test/providers/proxy_groups_test.dart \
            test/modules/nodes/manual_selection_test.dart \
            --reporter expanded 2>&1 | tee "$RUNNER_TEMP/linux-client-tests.log"
      - name: Retain scoped Linux client test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-client-tests
          path: |
            ${{ runner.temp }}/linux-client-tests.log
            ${{ runner.temp }}/linux-dialgate-go-tests.log
            ${{ runner.temp }}/linux-device-wrapper-tests.log
            ${{ runner.temp }}/linux-archive-tests.log
            ${{ runner.temp }}/linux-policy-workflow-tests.log
          if-no-files-found: warn
          retention-days: 14

  android_kotlin_compile:
    name: Exact candidate unsigned Android Kotlin compilation
    needs: [dial_source_binding]
    if: needs.dial_source_binding.result == 'success' && needs.dial_source_binding.outputs.ios_compile_mode == 'positive' && needs.dial_source_binding.outputs.verification_scope == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      TZ: UTC
    defaults:
      run:
        working-directory: candidate
    steps:
      - name: Checkout exact public compilation guard
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: .android-verifier
          persist-credentials: false
      - name: Checkout bound Android candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: onesyue/yuelink
          ref: ${{ needs.dial_source_binding.outputs.candidate_commit }}
          ssh-key: ${{ secrets.SRC_DEPLOY_KEY }}
          path: candidate
          submodules: recursive
          persist-credentials: false
      - name: Confirm Android source identity
        env:
          EXPECTED_CANDIDATE: ${{ needs.dial_source_binding.outputs.candidate_commit }}
        run: python3 ../.android-verifier/scripts/dialgate-binding.py confirm --checkout . --expected "$EXPECTED_CANDIDATE"
      - name: Set up reviewed Flutter SDK
        id: flutter
        uses: onesyue/yuelink-ci/.github/actions/setup-flutter@d6c9eb965b79818ed944b3e2df168905b535ff49 # pinned installer v1
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Set up canonical Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up canonical Android SDK tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - name: Install candidate Android SDK dependencies
        run: sdkmanager "platforms;android-37.0" "platforms;android-36" "ndk;28.2.13676358"
      - name: Resolve locked Android dependencies
        run: flutter pub get --enforce-lockfile
      - name: Compile only the admitted debug Kotlin graph
        shell: bash
        env:
          REVIEWED_FLUTTER_ROOT: ${{ steps.flutter.outputs.flutter-root }}
          EXPECTED_CANDIDATE: ${{ needs.dial_source_binding.outputs.candidate_commit }}
          BUILDER_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          printf 'source=%s\nbuilder=%s\n' "$EXPECTED_CANDIDATE" "$BUILDER_COMMIT" > "$RUNNER_TEMP/android-compile-identity.txt"
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$REVIEWED_FLUTTER_ROOT" > android/local.properties
          export DIAL_ANDROID_ROOT="$PWD/android"
          export DIAL_ANDROID_GRAPH="$RUNNER_TEMP/android-task-graph.json"
          export DIAL_ANDROID_GUARD="$GITHUB_WORKSPACE/.android-verifier/scripts/dialgate-android-task-guard.py"
          cd android
          ./gradlew --no-daemon --no-configuration-cache --no-build-cache --max-workers=2 --console=plain \
            --init-script "$GITHUB_WORKSPACE/.android-verifier/scripts/dialgate-android-compile.init.gradle" \
            :app:compileDebugKotlin 2>&1 | tee "$RUNNER_TEMP/android-kotlin-compile.log"
          test -s "$DIAL_ANDROID_GRAPH"
          python3 "$DIAL_ANDROID_GUARD" "$DIAL_ANDROID_GRAPH"
          # A skipped, cached or NO-SOURCE task is not a compilation receipt.
          grep -Fx '> Task :app:compileDebugKotlin' "$RUNNER_TEMP/android-kotlin-compile.log"
      - name: Retain Android compilation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-kotlin-compile
          path: |
            ${{ runner.temp }}/android-task-graph.json
            ${{ runner.temp }}/android-kotlin-compile.log
            ${{ runner.temp }}/android-compile-identity.txt
          if-no-files-found: warn
          retention-days: 14

  ios_swift_compile:
    name: Exact source unsigned iOS compilation
    needs: [dial_source_binding]
    if: needs.dial_source_binding.result == 'success'
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        working-directory: candidate
    steps:
      - name: Checkout exact public iOS verifier
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: .ios-verifier
          persist-credentials: false
      - name: Checkout exact private iOS source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: onesyue/yuelink
          ref: ${{ needs.dial_source_binding.outputs.candidate_commit }}
          ssh-key: ${{ secrets.SRC_DEPLOY_KEY }}
          path: candidate
          submodules: recursive
          fetch-depth: 2
          persist-credentials: false
      - name: Confirm source identity before preparation
        env:
          EXPECTED_CANDIDATE: ${{ needs.dial_source_binding.outputs.candidate_commit }}
        run: python3 ../.ios-verifier/scripts/dialgate-binding.py confirm --checkout . --expected "$EXPECTED_CANDIDATE"
      - name: Set up exact Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Set up pinned Flutter source SDK
        uses: onesyue/yuelink-ci/.github/actions/setup-flutter@d6c9eb965b79818ed944b3e2df168905b535ff49
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Compile real Runner and PacketTunnel without signing
        shell: bash
        env:
          EXPECTED_CANDIDATE: ${{ needs.dial_source_binding.outputs.candidate_commit }}
          EXPECTED_BUILDER: ${{ github.event.pull_request.head.sha || github.sha }}
          IOS_MODE: ${{ needs.dial_source_binding.outputs.ios_compile_mode }}
        run: |
          set -euo pipefail
          sdk="$(dirname "$(dirname "$(command -v flutter)")")"
          python3 ../.ios-verifier/scripts/dialgate-ios-compile.py \
            --checkout . --expected-source "$EXPECTED_CANDIDATE" \
            --expected-builder "$EXPECTED_BUILDER" --flutter-sdk "$sdk" \
            --mode "$IOS_MODE" --receipt-dir "$RUNNER_TEMP/ios-compile-receipt"
      - name: Retain allowlisted iOS compilation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ios-compile-receipt
          path: ${{ runner.temp }}/ios-compile-receipt/receipt.json
          if-no-files-found: warn
          retention-days: 14

  native_compile_summary:
    name: ${{ needs.dial_source_binding.outputs.verification_scope == 'ios-only' && 'iOS-only unsigned compilation summary' || 'Required native compilation summary' }}
    needs: [dial_source_binding, android_kotlin_compile, ios_swift_compile]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Require actual native compile jobs
        shell: bash
        env:
          BINDING: ${{ needs.dial_source_binding.result }}
          MODE: ${{ needs.dial_source_binding.outputs.ios_compile_mode }}
          SCOPE: ${{ needs.dial_source_binding.outputs.verification_scope }}
          SOURCE: ${{ needs.dial_source_binding.outputs.candidate_commit }}
          BUILDER: ${{ github.event.pull_request.head.sha || github.sha }}
          ANDROID: ${{ needs.android_kotlin_compile.result }}
          IOS: ${{ needs.ios_swift_compile.result }}
        run: |
          set -euo pipefail
          test "$BINDING" = success
          case "$SCOPE" in full|ios-only) ;; *) exit 1 ;; esac
          echo "Verification scope: $SCOPE; source: $SOURCE; builder: $BUILDER" >> "$GITHUB_STEP_SUMMARY"
          case "$MODE" in
            positive)
              case "$SCOPE" in
                full) test "$ANDROID" = success ;;
                ios-only) test "$ANDROID" = skipped ;;
              esac
              ;;
            negative)
              test "$ANDROID" = skipped
              echo 'Negative control remains red; inspect actual compiler evidence. No positive compilation acceptance.' >> "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
            *) exit 1 ;;
          esac
          test "$IOS" = success
          case "$SCOPE" in
            full) echo 'Bound Android and unsigned iOS compilation passed' >> "$GITHUB_STEP_SUMMARY" ;;
            ios-only) echo 'iOS-only unsigned compilation passed. Android/Linux/dial were not run and are not accepted by this check; prior full-suite and p95 results remain separate.' >> "$GITHUB_STEP_SUMMARY" ;;
          esac

  dial_gate:
    name: Dial gate (${{ matrix.name }})
    needs: [dial_source_binding]
    if: needs.dial_source_binding.result == 'success' && needs.dial_source_binding.outputs.ios_compile_mode == 'positive' && needs.dial_source_binding.outputs.verification_scope == 'full'
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    permissions:
      contents: read
      actions: read
    env:
      EXPECTED_CANDIDATE_REVISION: ${{ needs.dial_source_binding.outputs.candidate_commit }}
      EXPECTED_BASELINE_REVISION: '576460aedc31690b85ccb529f519a43024e19930'
      CANDIDATE_DIR: ${{ github.workspace }}/candidate
      BASELINE_DIR: ${{ github.workspace }}/baseline
      DIALGATE_OUT: ${{ github.workspace }}/dial-out
      DIALGATE_PLATFORM: ${{ matrix.platform }}
      DIALGATE_GOOS: ${{ matrix.goos }}
      DIALGATE_GOARCH: ${{ matrix.goarch }}
      SINGBOX_ASSET: ${{ matrix.singbox }}
      DIALGATE_TIMEOUT: ${{ matrix.sample_timeout }}
      GOTOOLCHAIN: local
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            kind: host
            platform: windows
            goos: windows
            goarch: amd64
            singbox: sing-box-1.14.4-windows-amd64.zip
            timeout_minutes: 45
            sample_timeout: 8s
          - name: macos
            os: macos-26
            kind: host
            platform: macos
            goos: darwin
            goarch: arm64
            singbox: sing-box-1.14.4-darwin-arm64.tar.gz
            timeout_minutes: 45
            sample_timeout: 8s
          - name: linux
            os: ubuntu-24.04
            kind: host
            platform: linux
            goos: linux
            goarch: amd64
            singbox: sing-box-1.14.4-linux-amd64.tar.gz
            timeout_minutes: 45
            sample_timeout: 8s
          - name: android
            os: ubuntu-24.04
            kind: android
            platform: android
            goos: android
            goarch: amd64
            singbox: sing-box-1.14.4-android-amd64.tar.gz
            timeout_minutes: 90
            sample_timeout: 12s
          - name: ios
            os: macos-26
            kind: ios
            platform: ios
            goos: ios
            goarch: arm64
            singbox: sing-box-1.14.4-darwin-arm64.tar.gz
            timeout_minutes: 60
            sample_timeout: 12s
    steps:
      - name: Checkout dial-gate candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: onesyue/yuelink
          ref: ${{ needs.dial_source_binding.outputs.candidate_commit }}
          ssh-key: ${{ secrets.SRC_DEPLOY_KEY }}
          path: candidate
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false

      - name: Parse device wrapper syntax without execution
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = (Resolve-Path -LiteralPath 'candidate/core/dialgate/device/windows.ps1').Path
          $tokens = $null
          $parseErrors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -ne 0) { throw 'Device wrapper PowerShell syntax is invalid' }

      - name: Checkout dial-gate baseline v1.3.174
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: onesyue/yuelink
          ref: v1.3.174
          ssh-key: ${{ secrets.SRC_DEPLOY_KEY }}
          path: baseline
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Enable KVM
        if: matrix.kind == 'android'
        run: |
          set -euo pipefail
          if [ ! -e /dev/kvm ]; then
            echo '::error:: /dev/kvm is missing; the Android dial gate needs a KVM runner'
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm

      - name: Dial on the runner
        if: matrix.kind == 'host'
        shell: bash
        run: bash candidate/core/dialgate/ci/run.sh host

      - name: Prepare Android dial binaries
        if: matrix.kind == 'android'
        shell: bash
        run: bash candidate/core/dialgate/ci/run.sh prepare

      - name: Boot Android emulator
        if: matrix.kind == 'android'
        shell: bash
        run: bash candidate/core/dialgate/ci/run.sh boot-android

      - name: Android emulator dial
        if: matrix.kind == 'android'
        shell: bash
        run: bash candidate/core/dialgate/ci/run.sh device

      - name: Stop Android emulator
        if: always() && matrix.kind == 'android'
        shell: bash
        run: bash candidate/core/dialgate/ci/run.sh stop-android

      - name: Compare Android reports
        if: matrix.kind == 'android'
        shell: bash
        run: bash candidate/core/dialgate/ci/run.sh compare

      - name: Dial inside the iOS simulator
        if: matrix.kind == 'ios'
        shell: bash
        run: bash candidate/core/dialgate/ci/run.sh ios

      - name: Upload dial reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dial-gate-${{ matrix.name }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            dial-out/baseline.json
            dial-out/candidate.json
            dial-out/gate.json
            dial-out/support.log
            dial-out/sing-box.log
            dial-out/android-support.log
            dial-out/android-sing-box.log

  dial_gate_summary:
    name: Dial gate table
    needs: [dial_source_binding, dial_gate]
    if: always() && needs.dial_source_binding.result == 'success' && needs.dial_gate.result != 'cancelled' && needs.dial_source_binding.outputs.ios_compile_mode == 'positive' && needs.dial_source_binding.outputs.verification_scope == 'full'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout exact public report verifier
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: .dial-verifier
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: dial-gate-*
          path: dial-reports
      - name: Verify dial report source identity
        shell: bash
        env:
          EXPECTED_CANDIDATE_REVISION: ${{ needs.dial_source_binding.outputs.candidate_commit }}
          EXPECTED_BASELINE_REVISION: '576460aedc31690b85ccb529f519a43024e19930'
          DIAL_BUILDER_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIAL_SOURCE_PR: ${{ needs.dial_source_binding.outputs.source_pr }}
          DIAL_VERIFICATION_ONLY: 'true'
        run: |
          python3 .dial-verifier/scripts/verify-dial-report-identity.py \
            --reports dial-reports --candidate "$EXPECTED_CANDIDATE_REVISION" \
            --baseline "$EXPECTED_BASELINE_REVISION"
      - name: Write the platform table
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          want = ["windows", "macos", "linux", "android", "ios"]
          protocols = {"vless-reality-tfo", "vless-reality", "vless-ws-tls", "hysteria2"}
          found = {}
          for path in Path("dial-reports").glob("*/gate.json"):
              data = json.loads(path.read_text())
              platform = data.get("platform")
              if platform not in want or path.parent.name != f"dial-gate-{platform}" or platform in found:
                  sys.exit("invalid or duplicate dial-gate platform evidence")
              rows = data.get("rows")
              if not isinstance(rows, list) or len(rows) != len(protocols):
                  sys.exit(f"incomplete protocol evidence for {platform}")
              if any(not isinstance(row, dict) for row in rows):
                  sys.exit(f"invalid protocol evidence for {platform}")
              if {row.get("protocol") for row in rows} != protocols:
                  sys.exit(f"missing, unknown or duplicate protocols for {platform}")
              if type(data.get("pass")) is not bool:
                  sys.exit(f"invalid platform verdict for {platform}")
              for row in rows:
                  if type(row.get("pass")) is not bool:
                      sys.exit(f"invalid protocol verdict for {platform}")
                  for field in ("baseline_samples", "candidate_samples"):
                      if type(row.get(field)) is not int or row[field] < 20:
                          sys.exit(f"insufficient dial samples for {platform}")
              found[platform] = data
          lines = ["| platform | protocol | baseline | candidate | baseline p95 ms | candidate p95 ms | pass |",
                   "|---|---|---:|---:|---:|---:|:---:|"]
          ok = True
          for platform in want:
              data = found.get(platform)
              if data is None:
                  ok = False
                  lines.append(f"| {platform} | missing | | | | | FAIL |")
                  continue
              if not data.get("pass"):
                  ok = False
              for row in data.get("rows", []):
                  def rate(value, n_ok, n):
                      if not n:
                          return "n/a"
                      return f"{value:.2f} ({n_ok}/{n})"
                  def ms(value):
                      return "n/a" if value is None else f"{value:.1f}"
                  mark = "pass" if row.get("pass") else "FAIL"
                  if not row.get("pass"):
                      ok = False
                  lines.append(
                      "| {platform} | {protocol} | {b} | {c} | {bp} | {cp} | {mark} |".format(
                          platform=platform,
                          protocol=row.get("protocol", ""),
                          b=rate(row.get("baseline_success_rate") or 0, row.get("baseline_ok") or 0, row.get("baseline_samples") or 0),
                          c=rate(row.get("candidate_success_rate") or 0, row.get("candidate_ok") or 0, row.get("candidate_samples") or 0),
                          bp=ms(row.get("baseline_p95_ms")),
                          cp=ms(row.get("candidate_p95_ms")),
                          mark=mark,
                      )
                  )
          table = "\n".join(lines) + "\n"
          print(table)
          path = os.environ.get("GITHUB_STEP_SUMMARY")
          if path:
              with open(path, "a", encoding="utf-8") as fh:
                  fh.write("### Real dial gate\n\n")
                  fh.write("iOS is the kernel inside the simulator. NetworkExtension is not started.\n\n")
                  fh.write(table)
          if not ok:
              sys.exit(1)
          PY

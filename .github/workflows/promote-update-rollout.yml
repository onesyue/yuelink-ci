name: Promote signed root update

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact signed candidate version (X.Y.Z)
        required: true
        type: string
      baseline_version:
        description: Exact signed baseline version (X.Y.Z)
        required: true
        type: string
      force:
        description: soft prompts every platform; hard forces every platform except iOS
        required: true
        type: choice
        options:
          - soft
          - hard
      force_reason:
        description: security or incompatible when force is hard; empty when soft
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: yuelink-root-update-promotion
  cancel-in-progress: false

jobs:
  admit:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact reviewed promotion workflow
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Admit force policy without writing the root
        shell: bash
        env:
          PROMOTE_VERSION: ${{ inputs.version }}
          PROMOTE_BASELINE_VERSION: ${{ inputs.baseline_version }}
          PROMOTE_FORCE: ${{ inputs.force }}
          PROMOTE_FORCE_REASON: ${{ inputs.force_reason }}
        run: bash scripts/promote-update-rollout.sh

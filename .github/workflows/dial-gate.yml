name: YueLink dial verification

# One dial gate for pull-request verification and release. The caller in
# build.yml decides the candidate ref. Release still fails unless every
# platform's summary passes. Auth/storage and unsigned iOS compilation run
# only when the caller sets run_pr_checks.
on:
  workflow_call:
    inputs:
      candidate_ref:
        description: YueLink ref or commit to verify
        required: true
        type: string
      run_pr_checks:
        description: Also run auth/storage tests and unsigned iOS compilation
        required: false
        type: boolean
        default: false
    secrets:
      SRC_DEPLOY_KEY:
        required: true
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact yuelink commit (40 lowercase hex)
        required: true
        type: string
      run_pr_checks:
        description: Also run auth/storage tests and unsigned iOS compilation
        required: false
        type: boolean
        default: true

permissions:
  contents: read

env:
  GO_VERSION: '1.27.4'
  FLUTTER_VERSION: '3.47.8'

jobs:
  dial_gate:
    name: Dial gate (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    permissions:
      contents: read
      actions: write
    env:
      CANDIDATE_DIR: ${{ github.workspace }}/candidate
      BASELINE_DIR: ${{ github.workspace }}/baseline
      DIALGATE_OUT: ${{ github.workspace }}/dial-out
      DIALGATE_PLATFORM: ${{ matrix.platform }}
      DIALGATE_GOOS: ${{ matrix.goos }}
      DIALGATE_GOARCH: ${{ matrix.goarch }}
      SINGBOX_ASSET: ${{ matrix.singbox }}
      DIALGATE_TIMEOUT: ${{ matrix.sample_timeout }}
      GOTOOLCHAIN: local
    # Hosted macOS arm64 accepts one macos-26 job at a time. Run 43029993034
    # queued Dial gate (ios) beside Dial gate (macos); iOS was cancelled with
    # zero steps ("not acquired by Runner of type hosted"). The macOS legs of
    # this run share one group so iOS waits for that runner. The group includes
    # the workflow and run id, so each run keeps its own queue. Other platforms
    # stay parallel, each on its own per-run group.
    concurrency:
      group: ${{ matrix.os == 'macos-26' && format('{0}-{1}-macos-26-dial', github.workflow, github.run_id) || format('{0}-{1}-dial-{2}', github.workflow, github.run_id, matrix.name) }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            kind: host
            platform: windows
            goos: windows
            goarch: amd64
            singbox: sing-box-1.14.4-windows-amd64.zip
            timeout_minutes: 45
            sample_timeout: 8s
          - name: macos
            os: macos-26
            kind: host
            platform: macos
            goos: darwin
            goarch: arm64
            singbox: sing-box-1.14.4-darwin-arm64.tar.gz
            timeout_minutes: 45
            sample_timeout: 8s
          - name: linux
            os: ubuntu-24.04
            kind: host
            platform: linux
            goos: linux
            goarch: amd64
            singbox: sing-box-1.14.4-linux-amd64.tar.gz
            timeout_minutes: 45
            sample_timeout: 8s
          - name: android
            os: ubuntu-24.04
            kind: android
            platform: android
            goos: android
            goarch: amd64
            singbox: sing-box-1.14.4-android-amd64.tar.gz
            timeout_minutes: 90
            sample_timeout: 12s
          - name: ios
            os: macos-26
            kind: ios
            platform: ios
            goos: ios
            goarch: arm64
            singbox: sing-box-1.14.4-darwin-arm64.tar.gz
            timeout_minutes: 60
            sample_timeout: 12s
    steps:
      - name: Checkout dial-gate candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: onesyue/yuelink
          ref: ${{ inputs.candidate_ref || inputs.source_sha }}
          ssh-key: ${{ secrets.SRC_DEPLOY_KEY }}
          path: candidate
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false

      - name: Checkout dial-gate baseline v1.3.174
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: onesyue/yuelink
          ref: v1.3.174
          ssh-key: ${{ secrets.SRC_DEPLOY_KEY }}
          path: baseline
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Dial kernel cache key
        id: dial_kernel
        shell: bash
        run: |
          set +e
          key=$(bash candidate/core/dialgate/ci/run.sh cache-key)
          status=$?
          set -e
          if [ "$status" -eq 0 ] && [ -n "$key" ]; then
            printf 'key=%s\n' "$key" >> "$GITHUB_OUTPUT"
          else
            echo "dial kernel cache key is unavailable; the kernels will be compiled"
            printf 'key=\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Restore dial kernels
        id: dial_kernel_cache
        if: steps.dial_kernel.outputs.key != ''
        continue-on-error: true
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dial-out/kernel-cache
          key: yue-dialkernel-v1-${{ matrix.name }}-${{ runner.os }}-${{ runner.arch }}-${{ env.GO_VERSION }}-${{ steps.dial_kernel.outputs.key }}-xcode-26.6
      - name: Enable KVM
        if: matrix.kind == 'android'
        run: |
          set -euo pipefail
          if [ ! -e /dev/kvm ]; then
            echo '::error:: /dev/kvm is missing; the Android dial gate needs a KVM runner'
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm

      - name: Dial on the runner
        if: matrix.kind == 'host'
        shell: bash
        run: bash candidate/core/dialgate/ci/run.sh host

      - name: Prepare Android dial binaries
        if: matrix.kind == 'android'
        shell: bash
        run: bash candidate/core/dialgate/ci/run.sh prepare

      - name: Boot Android emulator
        if: matrix.kind == 'android'
        shell: bash
        run: bash candidate/core/dialgate/ci/run.sh boot-android

      - name: Android emulator dial
        if: matrix.kind == 'android'
        shell: bash
        run: bash candidate/core/dialgate/ci/run.sh device

      - name: Stop Android emulator
        if: always() && matrix.kind == 'android'
        shell: bash
        run: bash candidate/core/dialgate/ci/run.sh stop-android

      - name: Compare Android reports
        if: matrix.kind == 'android'
        shell: bash
        run: bash candidate/core/dialgate/ci/run.sh compare

      - name: Dial inside the iOS simulator
        if: matrix.kind == 'ios'
        shell: bash
        run: bash candidate/core/dialgate/ci/run.sh ios

      - name: Upload dial reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dial-gate-${{ matrix.name }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            dial-out/baseline.json
            dial-out/candidate.json
            dial-out/gate.json
            dial-out/support.log
            dial-out/sing-box.log
            dial-out/android-support.log
            dial-out/android-sing-box.log

  linux_auth_storage:
    name: Auth and storage Linux verification
    if: inputs.run_pr_checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout verifier
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Checkout candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: onesyue/yuelink
          ref: ${{ inputs.candidate_ref || inputs.source_sha }}
          ssh-key: ${{ secrets.SRC_DEPLOY_KEY }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false

      - name: Install pinned Flutter
        uses: onesyue/yuelink-ci/.github/actions/setup-flutter@d6c9eb965b79818ed944b3e2df168905b535ff49 # pinned installer v1
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Run auth and storage tests
        env:
          EXPECTED_BUILDER: ${{ github.sha }}
        run: |
          set -euo pipefail
          sha="$(git -C candidate rev-parse HEAD)"
          python3 scripts/auth-storage-verify.py \
            --checkout candidate \
            --expected-source "$sha" \
            --expected-builder "$EXPECTED_BUILDER" \
            --receipt "$RUNNER_TEMP/auth-storage-receipt/receipt.json"

      - name: Retain auth receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: auth-storage-linux-receipt
          path: ${{ runner.temp }}/auth-storage-receipt/receipt.json
          if-no-files-found: warn
          retention-days: 14

  ios_unsigned_compile:
    name: Exact source unsigned iOS compilation
    needs: [dial_gate]
    if: always() && inputs.run_pr_checks && needs.dial_gate.result != 'cancelled'
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    defaults:
      run:
        working-directory: candidate
    steps:
      - name: Checkout verifier
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          path: verifier
          persist-credentials: false

      - name: Checkout candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: onesyue/yuelink
          ref: ${{ inputs.candidate_ref || inputs.source_sha }}
          ssh-key: ${{ secrets.SRC_DEPLOY_KEY }}
          path: candidate
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: Require pinned Xcode
        working-directory: verifier
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          version="$(xcodebuild -version | sed -n '1p')"
          test "$version" = "Xcode 26.6"

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install pinned Flutter
        uses: onesyue/yuelink-ci/.github/actions/setup-flutter@d6c9eb965b79818ed944b3e2df168905b535ff49 # pinned installer v1
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Prepare the iOS project without signing
        run: |
          set -euo pipefail
          flutter config --enable-swift-package-manager
          flutter pub get --enforce-lockfile
          dart run slang
          dart setup.dart build -p ios
          dart setup.dart install -p ios
          flutter build ios --release --no-codesign --config-only --no-pub

      - name: Compile Runner and PacketTunnel for the runner simulator
        env:
          EXPECTED_BUILDER: ${{ github.sha }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          python3 "$GITHUB_WORKSPACE/verifier/scripts/ios-unsigned-compile.py" \
            --checkout . \
            --expected-source "$sha" \
            --expected-builder "$EXPECTED_BUILDER" \
            --receipt "$RUNNER_TEMP/ios-compile-receipt/receipt.json"

      - name: Retain iOS compile receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-compile-receipt
          path: ${{ runner.temp }}/ios-compile-receipt/receipt.json
          if-no-files-found: warn
          retention-days: 14

# Updater-manifest freshness watchdog — lives HERE (public mirror repo, whose
# Actions run free) because the equivalent nightly job in the private repo
# stops running whenever the org's private-repo Actions billing freezes (it
# has been dead since 2026-08-05, "account payments have failed"). The
# manifest expires 35 days after publish and clients hard-reject an expired
# root, so a release gap + a dead watchdog = the entire sideload update
# channel goes dark silently. The checker pins the same public Ed25519 trust
# root as the client, rejects duplicate/unknown top-level fields, verifies the
# canonical signed payload, and then applies the shape/freshness policy. It
# never needs the private signing seed.
name: Manifest health

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  manifest_check:
    name: Updater manifest freshness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pinned manifest verifier
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Run offline signature regression suite
        run: python3 -m unittest -v tests/test_update_manifest_verifier.py

      - name: Validate live update.json freshness
        id: check
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          trap 'rm -f -- "$tmp"' EXIT
          if ! code="$(curl --fail --location --silent --show-error \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --connect-timeout 5 --max-time 30 --retry 2 --retry-all-errors \
            --output "$tmp" --write-out '%{http_code}' \
            "https://yuetong.app/update.json")"; then
            echo "detail=root manifest HTTPS fetch failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ "$code" != "200" ]; then
            echo "detail=root manifest fetch failed: HTTP $code" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if ! python3 scripts/verify-update-manifest.py "$tmp"; then
            echo "detail=root manifest failed pinned Ed25519 verification" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          jq -e '.schemaVersion == 1 and .channel == "stable"' "$tmp" >/dev/null || {
            echo "detail=root manifest shape unexpected (schemaVersion/channel)" >> "$GITHUB_OUTPUT"
            exit 1
          }
          version="$(jq -er '.version' "$tmp")"
          expires="$(jq -er '.expiresAt' "$tmp")"
          expires_epoch="$(date -u -d "$expires" +%s)"
          now_epoch="$(date -u +%s)"
          days_left=$(( (expires_epoch - now_epoch) / 86400 ))
          echo "live manifest: version=$version expiresAt=$expires (${days_left}d left)"
          if [ "$days_left" -lt 7 ]; then
            echo "detail=update.json v$version expires in ${days_left}d ($expires) — publish a release or re-stamp the manifest before clients reject it" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          while IFS= read -r url; do
            # Some production/WAF paths reject HEAD from GitHub-hosted runners
            # even though the client GET is healthy. Use a bounded GET: R2
            # returns one byte (206), while the small release page may ignore
            # Range and return its full ~22 KiB body. This exercises the same
            # method clients use without downloading installer payloads.
            if ! curl --fail --location --silent --show-error \
              --proto '=https' --proto-redir '=https' --tlsv1.2 \
              --connect-timeout 5 --max-time 20 --retry 2 --retry-all-errors \
              --range 0-0 --output /dev/null "$url"; then
              echo "detail=manifest references an unreachable release URL: $url" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          done < <(jq -r '[.releaseUrl, (.platforms[].url)] | .[]' "$tmp")
          while IFS=$'\t' read -r url expected; do
            sidecar="$(curl --fail --location --silent --show-error \
              --proto '=https' --proto-redir '=https' --tlsv1.2 \
              --connect-timeout 5 --max-time 20 --retry 2 --retry-all-errors \
              "${url}.sha256")" || {
                echo "detail=manifest checksum sidecar is unreachable: ${url}.sha256" >> "$GITHUB_OUTPUT"
                exit 1
              }
            if [ "$sidecar" != "$expected" ]; then
              echo "detail=manifest checksum sidecar disagrees with signed root: ${url}.sha256" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          done < <(jq -r '.platforms[] | [.url, .sha256] | @tsv' "$tmp")

      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          DETAIL: ${{ steps.check.outputs.detail }}
        run: |
          set -euo pipefail
          title="updater manifest health check failed"
          existing="$(gh issue list -R "$GITHUB_REPOSITORY" --state open \
            --search "$title in:title" --json number --jq '.[0].number // empty')"
          body="${DETAIL:-manifest health check failed (fetch/shape error)} — run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" -R "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi

# Updater-manifest freshness watchdog — lives HERE (public mirror repo, whose
# Actions run free) because the equivalent nightly job in the private repo
# stops running whenever the org's private-repo Actions billing freezes (it
# has been dead since 2026-08-05, "account payments have failed"). The
# manifest expires 35 days after publish and clients hard-reject an expired
# root, so a release gap + a dead watchdog = the entire sideload update
# channel goes dark silently. The checker pins the same public Ed25519 trust
# root as the client, rejects duplicate/unknown top-level fields, verifies the
# canonical signed payload, and then applies the shape/freshness policy. The
# Cloudflare-challenged release page is covered by a separate, fixed-purpose
# probe whose fresh result is verified against a second pinned Ed25519 public
# key. Neither private signing seed is present in GitHub.
name: Manifest health

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  manifest_check:
    name: Updater manifest freshness
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Only the failure handler opens/comments on this repository's watchdog issue.
      issues: write
    steps:
      - name: Checkout pinned manifest verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run offline signature regression suites
        run: |
          python3 -m unittest -v \
            tests/test_update_manifest_verifier.py \
            tests/test_release_page_health.py

      - name: Validate live update.json freshness
        id: check
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          release_health="$(mktemp)"
          https_headers="$(mktemp)"
          http_headers="$(mktemp)"
          trap 'rm -f -- "$tmp" "$release_health" "$https_headers" "$http_headers"' EXIT

          # The signed manifest protects object authenticity, but it cannot
          # repair a plaintext first request or a weakened zone TLS boundary.
          # Enforce the CDN controls independently before trusting the object.
          if ! http_code="$(curl --fail --silent --show-error \
            --proto '=http' --connect-timeout 5 --max-time 20 \
            --retry 2 --retry-all-errors \
            --dump-header "$http_headers" --output /dev/null \
            --write-out '%{http_code}' \
            'http://yuetong.app/update.json')"; then
            echo "detail=plaintext update endpoint could not be checked" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ "$http_code" != 301 ] ||
             ! tr -d '\r' < "$http_headers" | grep -Eqi \
               '^location:[[:space:]]*https://yuetong\.app/update\.json[[:space:]]*$'; then
            echo "detail=plaintext update endpoint must 301 to the exact HTTPS URL" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if curl --fail --silent --show-error \
            --tlsv1.1 --tls-max 1.1 \
            --connect-timeout 5 --max-time 20 \
            --output /dev/null 'https://yuetong.app/update.json'; then
            echo "detail=yuetong.app still accepts obsolete TLS 1.1" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if ! code="$(curl --fail --location --silent --show-error \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --tls-max 1.2 \
            --connect-timeout 5 --max-time 30 --retry 2 --retry-all-errors \
            --dump-header "$https_headers" \
            --output "$tmp" --write-out '%{http_code}' \
            "https://yuetong.app/update.json")"; then
            echo "detail=root manifest HTTPS fetch failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ "$code" != "200" ]; then
            echo "detail=root manifest fetch failed: HTTP $code" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if ! tr -d '\r' < "$https_headers" | grep -Eqi \
               '^strict-transport-security:[[:space:]]*max-age=15552000;[[:space:]]*includeSubDomains[[:space:]]*$'; then
            echo "detail=HTTPS manifest response lost the reviewed HSTS policy" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if ! tr -d '\r' < "$https_headers" | grep -Eqi \
               '^x-content-type-options:[[:space:]]*nosniff[[:space:]]*$'; then
            echo "detail=HTTPS manifest response lost X-Content-Type-Options nosniff" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if ! python3 scripts/verify-update-manifest.py "$tmp"; then
            echo "detail=root manifest failed pinned Ed25519 verification" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          jq -e '.schemaVersion == 1 and .channel == "stable"' "$tmp" >/dev/null || {
            echo "detail=root manifest shape unexpected (schemaVersion/channel)" >> "$GITHUB_OUTPUT"
            exit 1
          }
          version="$(jq -er '.version' "$tmp")"
          expires="$(jq -er '.expiresAt' "$tmp")"
          expires_epoch="$(date -u -d "$expires" +%s)"
          now_epoch="$(date -u +%s)"
          days_left=$(( (expires_epoch - now_epoch) / 86400 ))
          echo "live manifest: version=$version expiresAt=$expires (${days_left}d left)"
          if [ "$days_left" -lt 7 ]; then
            echo "detail=update.json v$version expires in ${days_left}d ($expires) — publish a release or re-stamp the manifest before clients reject it" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          # Cloudflare Bot Fight Mode challenges GitHub's ASN and cannot be
          # skipped by path. A fixed-purpose external probe checks the exact
          # release page and publishes only a signed, short-lived result. This
          # runner pins its public key and rejects replays, URL substitution,
          # failed identity checks, and unknown fields. It has no probe secret.
          health_url="https://yuetong.app/health/yue-to-download.json"
          if ! health_code="$(curl --fail --location --silent --show-error \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --connect-timeout 5 --max-time 20 --retry 2 --retry-all-errors \
            --max-filesize 65536 \
            --output "$release_health" --write-out '%{http_code}' "$health_url")"; then
            detail="signed release-page health envelope is unreachable: $health_url (HTTP ${health_code:-000})"
            echo "::error::$detail"
            echo "detail=$detail" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ "$health_code" != "200" ]; then
            detail="signed release-page health envelope returned HTTP $health_code"
            echo "::error::$detail"
            echo "detail=$detail" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if ! python3 scripts/verify-release-page-health.py "$release_health"; then
            detail="signed release-page health envelope failed pinned Ed25519/freshness/identity policy"
            echo "::error::$detail"
            echo "detail=$detail" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          while IFS= read -r url; do
            # R2 honors Range and returns one byte (206), avoiding downloads
            # of the nine large installer payloads.
            if ! asset_code="$(curl --fail --location --silent --show-error \
              --proto '=https' --proto-redir '=https' --tlsv1.2 \
              --connect-timeout 5 --max-time 20 --retry 2 --retry-all-errors \
              --range 0-0 --output /dev/null --write-out '%{http_code}' "$url")"; then
              detail="manifest references an unreachable release URL: $url (HTTP ${asset_code:-000})"
              echo "::error::$detail"
              echo "detail=$detail" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            case "$asset_code" in
              200|206) ;;
              *)
                detail="release asset returned unexpected success status: $url (HTTP $asset_code)"
                echo "::error::$detail"
                echo "detail=$detail" >> "$GITHUB_OUTPUT"
                exit 1
                ;;
            esac
            echo "release asset probe: $url HTTP $asset_code"
          done < <(jq -r '.platforms[].url' "$tmp")
          while IFS=$'\t' read -r url expected; do
            sidecar="$(curl --fail --location --silent --show-error \
              --proto '=https' --proto-redir '=https' --tlsv1.2 \
              --connect-timeout 5 --max-time 20 --retry 2 --retry-all-errors \
              "${url}.sha256")" || {
                echo "detail=manifest checksum sidecar is unreachable: ${url}.sha256" >> "$GITHUB_OUTPUT"
                exit 1
              }
            if [ "$sidecar" != "$expected" ]; then
              echo "detail=manifest checksum sidecar disagrees with signed root: ${url}.sha256" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          done < <(jq -r '.platforms[] | [.url, .sha256] | @tsv' "$tmp")

      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          DETAIL: ${{ steps.check.outputs.detail }}
        run: |
          set -euo pipefail
          title="updater manifest health check failed"
          existing="$(gh issue list -R "$GITHUB_REPOSITORY" --state open \
            --search "$title in:title" --json number --jq '.[0].number // empty')"
          body="${DETAIL:-manifest health check failed (fetch/shape error)} — run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" -R "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi

# Updater-manifest freshness watchdog — lives HERE (public mirror repo, whose
# Actions run free) because the equivalent nightly job in the private repo
# stops running whenever the org's private-repo Actions billing freezes (it
# has been dead since 2026-08-05, "account payments have failed"). The
# manifest expires 35 days after publish and clients hard-reject an expired
# root, so a release gap + a dead watchdog = the entire sideload update
# channel goes dark silently. The checker pins the same public Ed25519 trust
# root as the client, rejects duplicate/unknown top-level fields, verifies the
# canonical signed payload, and then applies the shape/freshness policy. It
# never needs the private signing seed.
name: Manifest health

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  manifest_check:
    name: Updater manifest freshness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pinned manifest verifier
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Run offline signature regression suite
        run: python3 -m unittest -v tests/test_update_manifest_verifier.py

      - name: Validate live update.json freshness
        id: check
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          release_dom="$(mktemp)"
          release_log="$(mktemp)"
          release_profile="$(mktemp -d)"
          trap 'rm -f -- "$tmp" "$release_dom" "$release_log"; rm -rf -- "$release_profile"' EXIT
          if ! code="$(curl --fail --location --silent --show-error \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --connect-timeout 5 --max-time 30 --retry 2 --retry-all-errors \
            --output "$tmp" --write-out '%{http_code}' \
            "https://yuetong.app/update.json")"; then
            echo "detail=root manifest HTTPS fetch failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ "$code" != "200" ]; then
            echo "detail=root manifest fetch failed: HTTP $code" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if ! python3 scripts/verify-update-manifest.py "$tmp"; then
            echo "detail=root manifest failed pinned Ed25519 verification" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          jq -e '.schemaVersion == 1 and .channel == "stable"' "$tmp" >/dev/null || {
            echo "detail=root manifest shape unexpected (schemaVersion/channel)" >> "$GITHUB_OUTPUT"
            exit 1
          }
          version="$(jq -er '.version' "$tmp")"
          expires="$(jq -er '.expiresAt' "$tmp")"
          expires_epoch="$(date -u -d "$expires" +%s)"
          now_epoch="$(date -u +%s)"
          days_left=$(( (expires_epoch - now_epoch) / 86400 ))
          echo "live manifest: version=$version expiresAt=$expires (${days_left}d left)"
          if [ "$days_left" -lt 7 ]; then
            echo "detail=update.json v$version expires in ${days_left}d ($expires) — publish a release or re-stamp the manifest before clients reject it" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          # Cloudflare Bot Fight Mode deliberately challenges GitHub-hosted
          # curl traffic and cannot be bypassed by a custom WAF skip rule.
          # Exercise the release URL with the Chrome already present on the
          # official runner image. Wall time, virtual time and output size are
          # all bounded; no browser is downloaded at runtime.
          release_url="$(jq -er '.releaseUrl' "$tmp")"
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$browser" ]; then
            detail="official runner image has no system Chrome/Chromium"
            echo "::error::$detail"
            echo "detail=$detail" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if ! timeout --signal=TERM --kill-after=5s 35s "$browser" \
            --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --disable-background-networking --disable-component-update \
            --disable-default-apps --disable-extensions --disable-sync \
            --metrics-recording-only --no-first-run \
            --user-data-dir="$release_profile" --virtual-time-budget=10000 \
            --dump-dom "$release_url" >"$release_dom" 2>"$release_log"; then
            detail="real-browser release URL probe failed or exceeded 35s: $release_url"
            echo "::error::$detail"
            echo "detail=$detail" >> "$GITHUB_OUTPUT"
            tail -n 20 "$release_log" || true
            exit 1
          fi
          python3 - "$release_dom" "$release_url" <<'PY'
          import sys
          from html.parser import HTMLParser
          from pathlib import Path

          dom_path = Path(sys.argv[1])
          expected = sys.argv[2]
          raw = dom_path.read_bytes()
          min_dom_bytes = 1024
          max_dom_bytes = 1048576
          if not min_dom_bytes <= len(raw) <= max_dom_bytes:
              raise SystemExit(
                  f"release page DOM size outside [{min_dom_bytes}, {max_dom_bytes}]: {len(raw)}"
              )
          try:
              text = raw.decode("utf-8")
          except UnicodeDecodeError as exc:
              raise SystemExit("release page DOM is not UTF-8") from exc

          challenge_markers = (
              "just a moment",
              "cf-chl",
              "challenge-platform",
              "enable javascript and cookies",
              "attention required! | cloudflare",
          )
          lowered = text.lower()
          found = [marker for marker in challenge_markers if marker in lowered]
          if found:
              raise SystemExit(f"Cloudflare challenge DOM returned: {', '.join(found)}")

          class DownloadPageParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.canonical = None
                  self.og_url = None
                  self.description = None
                  self.in_title = False
                  self.title_parts = []

              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  if tag == "link" and values.get("rel") == "canonical":
                      self.canonical = values.get("href")
                  if tag == "meta" and values.get("property") == "og:url":
                      self.og_url = values.get("content")
                  if tag == "meta" and values.get("name") == "description":
                      self.description = values.get("content")
                  if tag == "title":
                      self.in_title = True

              def handle_endtag(self, tag):
                  if tag == "title":
                      self.in_title = False

              def handle_data(self, data):
                  if self.in_title:
                      self.title_parts.append(data)

          parsed = DownloadPageParser()
          parsed.feed(text)
          title = "".join(parsed.title_parts).strip()
          if parsed.canonical != expected or parsed.og_url != expected:
              raise SystemExit(
                  "release page final URL identity mismatch: "
                  f"canonical={parsed.canonical!r} og:url={parsed.og_url!r} expected={expected!r}"
              )
          if "Yue.to" not in title or "下载客户端" not in title:
              raise SystemExit(f"release page title is not the YueLink download page: {title!r}")
          if not parsed.description or "YueLink" not in parsed.description:
              raise SystemExit("release page description is missing the YueLink product marker")
          print(f"release browser probe: {expected} DOM={len(raw)} bytes title={title!r}")
          PY
          while IFS= read -r url; do
            # R2 honors Range and returns one byte (206), avoiding downloads
            # of the nine large installer payloads.
            if ! asset_code="$(curl --fail --location --silent --show-error \
              --proto '=https' --proto-redir '=https' --tlsv1.2 \
              --connect-timeout 5 --max-time 20 --retry 2 --retry-all-errors \
              --range 0-0 --output /dev/null --write-out '%{http_code}' "$url")"; then
              detail="manifest references an unreachable release URL: $url (HTTP ${asset_code:-000})"
              echo "::error::$detail"
              echo "detail=$detail" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            case "$asset_code" in
              200|206) ;;
              *)
                detail="release asset returned unexpected success status: $url (HTTP $asset_code)"
                echo "::error::$detail"
                echo "detail=$detail" >> "$GITHUB_OUTPUT"
                exit 1
                ;;
            esac
            echo "release asset probe: $url HTTP $asset_code"
          done < <(jq -r '.platforms[].url' "$tmp")
          while IFS=$'\t' read -r url expected; do
            sidecar="$(curl --fail --location --silent --show-error \
              --proto '=https' --proto-redir '=https' --tlsv1.2 \
              --connect-timeout 5 --max-time 20 --retry 2 --retry-all-errors \
              "${url}.sha256")" || {
                echo "detail=manifest checksum sidecar is unreachable: ${url}.sha256" >> "$GITHUB_OUTPUT"
                exit 1
              }
            if [ "$sidecar" != "$expected" ]; then
              echo "detail=manifest checksum sidecar disagrees with signed root: ${url}.sha256" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          done < <(jq -r '.platforms[] | [.url, .sha256] | @tsv' "$tmp")

      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          DETAIL: ${{ steps.check.outputs.detail }}
        run: |
          set -euo pipefail
          title="updater manifest health check failed"
          existing="$(gh issue list -R "$GITHUB_REPOSITORY" --state open \
            --search "$title in:title" --json number --jq '.[0].number // empty')"
          body="${DETAIL:-manifest health check failed (fetch/shape error)} — run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" -R "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi

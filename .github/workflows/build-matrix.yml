name: Build YueLink matrix

# Called by build.yml. github.* is the caller run, not a new event.
# Workflow env is repeated because a caller env map is not inherited.
on:
  workflow_call:
    inputs:
      source_commit:
        description: attested private source
        required: true
        type: string
      matrix:
        description: JSON build matrix from plan
        required: true
        type: string

permissions:
  contents: read

env:
  # Private template fallback only; public runs use their exact builder SHA.
  COVERAGE_TOOLS_SHA: '07856de8be832ceed6e4daeff7bf840c2269d8dc'
  # Flutter 3.47.8 / Dart 3.13.7 (2026-10-23): BoringSSL distrusts the
  # compromised eMudhra intermediates (GHSA-frr6-h895-5pxp) and Android 14+
  # reads the updatable Conscrypt root store. Embedder renderer files are
  # unchanged from 3.47.7. Exact archives are verified by setup-flutter.
  FLUTTER_VERSION: '3.47.8'
  # Go 1.27.1 (2026-09-01): 跨 minor 从 1.26.8 升上来，与 yue-node/Xray-core
  # fork 的发布工具链对齐。拿到 1.27 的小对象分配优化（<80B 分配路径约 -30%，
  # 分配密集程序整体约 1%）；Green Tea GC 在 1.26 就已默认、不是本次新增。
  #
  # 跨 minor 此前是一道**人工门**（"升之前先核 metacubex/gvisor 的 linkname 假设"），
  # 因为 gvisor fork 在 amd64 上按写死的偏移直接改 runtime.sched.nmspinning，
  # 失配不报编译错误、只在运行期把调度器计数器写坏。2026-09-20 起该门由
  # core/gvisor_runtime_abi_test.go 自动执行：它用当前工具链真实编译出的 DWARF
  # 布局，对上 gvisor fork 里写死的 NMSPINNING_OFFSET 与 WaitReason 字面量。
  # 升级时实测：nmspinning 偏移在 linux/windows/darwin ×amd64 下 1.26.8 与 1.27.1
  # 均为 116、schedt 大小同为 6872；三个 WaitReason 常量两版一致；
  # 对照 1.25.0=100 / 1.24.0=92 证明该判据确实会随版本变动。
  # Keep the release builder and govulncheck on this exact patch release;
  # a floating 1.27 selector can silently rebuild the same tag against a
  # different standard library.
  # 2026-10-21: Go 1.27.3 addresses GO-2026-6809; retain the shipped-toolchain ABI guard.
  # 2026-11-11: Go 1.27.4 addresses GO-2026-6859 (net/http MaxBytesReader race).
  GO_VERSION: '1.27.4'
  # Production builds consume the reviewed module graph exactly. `core/go.mod`
  # and go.sum are tidy against the pinned mihomo submodule; dependency drift
  # must fail the build instead of being resolved implicitly on a runner.
  GOFLAGS: -mod=readonly
  # Opt JS actions (actions/attest*, etc.) into Node.js 24 now, ahead of the
  # 2026-06-16 forced default — silences the recurring Node 20 deprecation
  # warning. Safe to drop once Node 24 is the runner default.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    # Same credential boundary as preflight (see the note there).
    environment: yuelink-build
    env:
      PLATFORM: ${{ matrix.platform }}
    permissions:
      contents: read
      id-token: write      # OIDC for build-provenance attestation
      attestations: write  # store the signed attestation per platform binary
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    steps:
      # 2026-06-01: Android(及 Linux)构建 native libs 时撑爆 ubuntu runner 磁盘
      # (No space left on device @ mergeReleaseNativeLibs)。先清掉用不到的大件
      # (dotnet/ghc/boost/swift/docker 镜像,~25–30G),不碰 Android SDK/NDK。
      - name: Free disk space (Linux runners)
        if: runner.os == 'Linux'
        run: |
          echo "before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /usr/local/share/powershell \
            /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          echo "after:"; df -h / | tail -1

      # CI 镜像仓：checkout public signed tag 绑定的 exact source commit。
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: onesyue/yuelink
          ref: ${{ inputs.source_commit }}
          ssh-key: ${{ secrets.SRC_DEPLOY_KEY }}
          submodules: recursive
          persist-credentials: false

      - name: Verify exact attested source checkout
        shell: bash
        env:
          ATTESTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          BUILT_SOURCE_COMMIT="$(git rev-parse HEAD)"
          [ "$BUILT_SOURCE_COMMIT" = "$ATTESTED_SOURCE_COMMIT" ] || {
            echo "::error::build source drift: attested=$ATTESTED_SOURCE_COMMIT built=$BUILT_SOURCE_COMMIT"
            exit 1
          }
          echo "BUILT_SOURCE_COMMIT=$BUILT_SOURCE_COMMIT"

      - name: Select Xcode 26.6 for Apple builds
        if: matrix.platform == 'ios' || matrix.platform == 'macos'
        shell: bash
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR" || { echo "::error::pinned Xcode 26.6 is absent"; exit 1; }
          version="$(xcodebuild -version | sed -n '1p')"
          test "$version" = 'Xcode 26.6' || { echo "::error::unexpected Xcode: $version"; exit 1; }
          mkdir -p "$HOME/Library/Developer/Xcode/DerivedData/CompilationCache.noindex"
          # xcodebuild consumes this override even when invoked by Flutter.
          cache_config="$RUNNER_TEMP/yuelink-compilation-cache.xcconfig"
          cat > "$cache_config" <<'XCCONFIG'
          COMPILATION_CACHE_ENABLE_CACHING = YES
          CLANG_ENABLE_PREFIX_MAPPING = YES
          CLANG_ENABLE_PROJECT_PREFIX_MAPPING = YES
          SWIFT_ENABLE_PREFIX_MAPPING = YES
          SWIFT_ENABLE_PROJECT_PREFIX_MAPPING = YES
          COMPILATION_CACHE_CAS_PATH = $(HOME)/Library/Developer/Xcode/DerivedData/CompilationCache.noindex
          XCCONFIG
          {
            echo "DEVELOPER_DIR=$DEVELOPER_DIR"
            echo "XCODE_XCCONFIG_FILE=$cache_config"
          } >> "$GITHUB_ENV"

      - name: Restore Xcode compilation cache
        id: xcode_cache_restore
        if: matrix.platform == 'ios' || matrix.platform == 'macos'
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Developer/Xcode/DerivedData/CompilationCache.noindex
          key: yue-sdk-3.47.8-737ba8f885dc774b53b442759999a312c9461e4e-cf636b1dfb818dd6a3ff16e390e93b1a036969c8-3.13.7-${{ hashFiles('pubspec.lock') }}-yue-xcode-cc-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-${{ github.sha }}
          restore-keys: |
            yue-sdk-3.47.8-737ba8f885dc774b53b442759999a312c9461e4e-cf636b1dfb818dd6a3ff16e390e93b1a036969c8-3.13.7-${{ hashFiles('pubspec.lock') }}-yue-xcode-cc-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-

      # ── Toolchains (Go for core, Flutter for app, Java for android) ───────
      # Flutter SDK cache stays on (reviewed 2026-08-31). setup-go's own
      # cache stays off. Module and compiler caches are separate actions/cache
      # entries. Each key includes OS, architecture, platform, Go version, and
      # commit, so a compiler cache is not shared across operating systems or
      # across the two Apple jobs. The restore prefix omits the commit. A miss
      # does not gate "Build & install Go core".
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Restore Go module cache
        if: runner.os != 'Windows'
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: yue-sdk-3.47.8-737ba8f885dc774b53b442759999a312c9461e4e-cf636b1dfb818dd6a3ff16e390e93b1a036969c8-3.13.7-${{ hashFiles('pubspec.lock') }}-yue-gomod-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-${{ env.GO_VERSION }}-${{ github.sha }}
          restore-keys: |
            yue-sdk-3.47.8-737ba8f885dc774b53b442759999a312c9461e4e-cf636b1dfb818dd6a3ff16e390e93b1a036969c8-3.13.7-${{ hashFiles('pubspec.lock') }}-yue-gomod-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-${{ env.GO_VERSION }}-

      - name: Restore Go module cache (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\go\pkg\mod
          key: yue-sdk-3.47.8-737ba8f885dc774b53b442759999a312c9461e4e-cf636b1dfb818dd6a3ff16e390e93b1a036969c8-3.13.7-${{ hashFiles('pubspec.lock') }}-yue-gomod-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-${{ env.GO_VERSION }}-${{ github.sha }}
          restore-keys: |
            yue-sdk-3.47.8-737ba8f885dc774b53b442759999a312c9461e4e-cf636b1dfb818dd6a3ff16e390e93b1a036969c8-3.13.7-${{ hashFiles('pubspec.lock') }}-yue-gomod-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-${{ env.GO_VERSION }}-

      - name: Restore Go compiler cache
        if: runner.os != 'Windows'
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.os == 'macOS' && '~/Library/Caches/go-build' || '~/.cache/go-build' }}
          key: yue-sdk-3.47.8-737ba8f885dc774b53b442759999a312c9461e4e-cf636b1dfb818dd6a3ff16e390e93b1a036969c8-3.13.7-${{ hashFiles('pubspec.lock') }}-yue-gocache-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-${{ env.GO_VERSION }}-${{ github.sha }}
          restore-keys: |
            yue-sdk-3.47.8-737ba8f885dc774b53b442759999a312c9461e4e-cf636b1dfb818dd6a3ff16e390e93b1a036969c8-3.13.7-${{ hashFiles('pubspec.lock') }}-yue-gocache-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-${{ env.GO_VERSION }}-

      - name: Restore Go compiler cache (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\AppData\Local\go-build
          key: yue-sdk-3.47.8-737ba8f885dc774b53b442759999a312c9461e4e-cf636b1dfb818dd6a3ff16e390e93b1a036969c8-3.13.7-${{ hashFiles('pubspec.lock') }}-yue-gocache-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-${{ env.GO_VERSION }}-${{ github.sha }}
          restore-keys: |
            yue-sdk-3.47.8-737ba8f885dc774b53b442759999a312c9461e4e-cf636b1dfb818dd6a3ff16e390e93b1a036969c8-3.13.7-${{ hashFiles('pubspec.lock') }}-yue-gocache-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-${{ env.GO_VERSION }}-

      - uses: onesyue/yuelink-ci/.github/actions/setup-flutter@d6c9eb965b79818ed944b3e2df168905b535ff49 # pinned installer v1
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Restore pub cache (lockfile-verified)
        if: runner.os != 'Windows'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: yue-sdk-3.47.8-737ba8f885dc774b53b442759999a312c9461e4e-cf636b1dfb818dd6a3ff16e390e93b1a036969c8-3.13.7-${{ hashFiles('pubspec.lock') }}-yue-pub-v1-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}

      - name: Restore pub cache (lockfile-verified, Windows)
        if: runner.os == 'Windows'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\AppData\Local\Pub\Cache
          key: yue-sdk-3.47.8-737ba8f885dc774b53b442759999a312c9461e4e-cf636b1dfb818dd6a3ff16e390e93b1a036969c8-3.13.7-${{ hashFiles('pubspec.lock') }}-yue-pub-v1-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}

      - name: Setup Java (Android only)
        if: matrix.platform == 'android'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android NDK
        if: matrix.platform == 'android'
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # The default also requests the retired SDK "tools" package.
          # Command-line tools are set up by the action; NDK is pinned below.
          packages: platform-tools

      - name: Install Android NDK r28c
        if: matrix.platform == 'android'
        shell: bash
        run: |
          sdkmanager "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          apt_bounded() {
            local attempt=1
            local status=0
            while [ "$attempt" -le 2 ]; do
              set +e
              # KILL bounds even an apt subprocess that ignores TERM at 180s.
              sudo timeout --signal=KILL 180 apt-get "$@"
              status=$?
              # GNU timeout reports 137 when its KILL deadline fires.
              if [ "$status" -eq 137 ]; then status=124; fi
              set -e
              if [ "$status" -eq 0 ]; then
                return 0
              fi
              # The helper returns 1 to retry and 2 for the final timeout.
              # A nonzero first result must not abort the retry loop.
              python3 scripts/ci/link_platform_cache.py apt-result --attempt "$attempt" --status "$status" || true
              if [ "$attempt" -eq 2 ]; then
                return "$status"
              fi
              attempt=$((attempt + 1))
            done
            exit "$status"
          }
          apt_bounded update -q
          apt_bounded install -y --no-install-recommends \
            libgtk-3-dev libblkid-dev liblzma-dev ninja-build \
            libglib2.0-dev gsettings-desktop-schemas libpango1.0-dev libcairo2-dev \
            libsecret-1-dev libstdc++-12-dev \
            libkeybinder-3.0-dev libayatana-appindicator3-dev \
            libasound2-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libcurl4-openssl-dev libc-ares-dev \
            pkg-config cmake clang build-essential python3-venv nasm \
            zlib1g-dev libfontconfig1-dev libegl1-mesa-dev \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxss-dev libxext-dev \
            libxinerama-dev libxpresent-dev libxv-dev libpulse-dev libva-dev \
            libvdpau-dev libdrm-dev libgbm-dev libwayland-dev wayland-protocols \
            libxkbcommon-dev xvfb xauth mesa-utils file
          {
            echo "CMAKE_PREFIX_PATH=/usr"
            echo "CMAKE_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu"
            echo "CMAKE_INCLUDE_PATH=/usr/include"
          } >> "$GITHUB_ENV"

      - name: Record Linux media identity
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ImageVersion"
          for input in scripts/linux_media/build.py scripts/native/source_offer.py third_party/linux_media/sources.lock.json third_party/apple_media/sources.lock.json third_party/apple_media/ffmpeg-configure.txt; do
            test -s "$input"
          done
          # Include tracked recipes/patches and the absolute install prefix:
          # pkg-config files embed that prefix and cannot move between runners.
          identity=$({
            printf '%s\n' "$ImageVersion" "$RUNNER_TEMP/linux-media/prefix"
            git ls-files -s -- scripts/linux_media scripts/native/source_offer.py third_party/linux_media third_party/apple_media/sources.lock.json third_party/apple_media/ffmpeg-configure.txt
          } | git hash-object --stdin)
          echo "LINUX_MEDIA_INPUTS_SHA=$identity" >> "$GITHUB_ENV"

      - name: Restore Linux native media
        id: linux_media_cache
        if: matrix.platform == 'linux'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/linux-media/prefix
          key: yue-linux-media-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.LINUX_MEDIA_INPUTS_SHA }}-meson1.9.1-cmake3.31.10-ninja1.13.0

      - name: Build source-locked Linux native media
        if: matrix.platform == 'linux'
        shell: bash
        env:
          MEDIA_CACHE_HIT: ${{ steps.linux_media_cache.outputs.cache-hit }}
          # Read the reviewed prior source offers without anonymous API limits.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$MEDIA_CACHE_HIT" != true ]; then
            python3 -m venv "$RUNNER_TEMP/media-tools"
            "$RUNNER_TEMP/media-tools/bin/pip" install 'meson==1.9.1' 'cmake==3.31.10' 'ninja==1.13.0'
            export PATH="$RUNNER_TEMP/media-tools/bin:$PATH"
            python3 scripts/linux_media/build.py --work "$RUNNER_TEMP/linux-media" --jobs 4
          fi
          test -s "$RUNNER_TEMP/linux-media/prefix/lib/libmpv.so"
          media_prefix="$RUNNER_TEMP/linux-media/prefix"
          {
            echo "YUELINK_MEDIA_PREFIX=$media_prefix"
            echo "PKG_CONFIG_PATH=$media_prefix/lib/pkgconfig"
            echo "LD_LIBRARY_PATH=$media_prefix/lib"
            echo "CMAKE_PREFIX_PATH=$media_prefix:/usr"
          } >> "$GITHUB_ENV"

      - name: Verify Apple media slices and signatures
        if: matrix.platform == 'ios' || matrix.platform == 'macos'
        run: python3 scripts/apple_media/verify.py --mach-o

      - name: Verify Android native media inventory and JNI ownership
        if: matrix.platform == 'android'
        run: |
          python3 scripts/native/android/verify.py
          python3 scripts/native_tests/android_media/test_jni_helper.py --ndk "$ANDROID_NDK_HOME"

      # ── Geodata: declared as Flutter assets, .gitignored — fetch at CI ────
      # (v1.2.90) The 23 MB GeoIP/GeoSite.dat bundle + its CI download/assert
      # is GONE. The client no longer inlines GEOSITE/GEOIP rules — it seeds
      # the ~1 MB `.mrs` rule-provider set (assets/ruleset/, committed to git)
      # into ./ruleset/yueto/ at startup. The private subtree avoids colliding
      # with generic paths from imported third-party subscriptions.
      # This structurally eliminates the v1.2.87/88 "bundled geodata vs rules
      # mismatch" brick class: there is no geodata pack to mismatch. The .mrs
      # are checked out from git (no build-time network dependency); this
      # guard proves the checkout carries the exact reviewed inventory.
      - name: Verify bundled ruleset (.mrs seed set)
        shell: bash
        run: |
          set -euo pipefail
          dir=assets/ruleset
          expected="$dir/inventory.txt"
          test -f "$expected"
          actual=$(mktemp)
          trap 'rm -f "$actual"' EXIT
          find "$dir" -maxdepth 1 -type f -name '*.mrs' \
            -exec basename {} \; | LC_ALL=C sort > "$actual"
          grep -Ev '^[[:space:]]*(#|$)' "$expected" \
            | LC_ALL=C sort | diff -u - "$actual" || {
              echo "::error::bundled .mrs inventory drift"
              exit 1
            }
          count=$(wc -l < "$actual" | tr -d ' ')
          [ "$count" -eq 39 ] || {
            echo "::error::expected exactly 39 .mrs assets, found $count"
            exit 1
          }
          # Every .mrs is a zstd frame — magic 0x28 0xB5 0x2F 0xFD. A file that
          # isn't (e.g. an HTML 404 page committed by mistake) would brick
          # rule-provider load on device; catch it here. Use `od` (POSIX,
          # present on ubuntu/macos/git-bash) — NOT `xxd`, which is missing on
          # some Windows/macOS runners.
          for f in "$dir"/*.mrs; do
            size=$(wc -c < "$f" | tr -d ' ')
            [ "$size" -gt 64 ] || {
              echo "::error::$f is truncated ($size bytes)"
              exit 1
            }
            magic=$(od -An -tx1 -N4 "$f" | tr -d ' \n')
            if [ "$magic" != "28b52ffd" ]; then
              echo "::error::$f is not a zstd .mrs (magic=$magic) — corrupt seed committed?"
              exit 1
            fi
          done
          echo "ruleset seed OK: exact $count-file inventory, all zstd."

      # ── Resolve version ──────────────────────────────────────────────────
      # source_binding rejects every non-stable tag before this job. The
      # prerelease case remains only as a defensive legacy branch; it cannot
      # authorize source checkout or publication.
      - name: Extract version from pubspec
        shell: bash
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          BUILD_NUM=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f2)
          # `release_tag.sh kind` exits 2 on anything that is not vX.Y.Z[-pre.N],
          # and a branch name never is. Calling it unconditionally therefore
          # killed every `workflow_dispatch` run at this step — which is the
          # whole "只构建某平台(测试用)" path the `only:` input advertises. It has
          # never reached a single build step. Ask ref_type first.
          #
          # Deliberately keyed on ref_type, NOT on "does the name parse": a tag
          # push with a malformed tag must still hard-fail here, exactly as
          # before. Only non-tag refs take the dev branch.
          TAG_KIND=dev
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG_KIND="$(bash scripts/ci/release_tag.sh kind "$GITHUB_REF_NAME")"
          fi
          case "$TAG_KIND" in
            prerelease)
              # Unreachable behind stable-only source_binding. Preserve the
              # historical parser branch solely so a future gate regression
              # cannot collapse names onto a stable version.
              APP_VERSION="${GITHUB_REF_NAME#v}"
              ;;
            *)
              APP_VERSION="${VERSION}"
              ;;
          esac
          echo "APP_VERSION=${APP_VERSION}" >> "$GITHUB_ENV"
          echo "BUILD_NUM=${BUILD_NUM}" >> "$GITHUB_ENV"

      - run: flutter pub get --enforce-lockfile
      - run: dart run slang

      - name: Probe Windows durable credential storage
        if: matrix.platform == 'windows'
        run: dart run tool/windows_durability_probe.dart

      - name: Verify native packet tunnel config editor
        if: matrix.platform == 'ios'
        run: python3 scripts/ci/test_packet_tunnel_config.py --sanitize --check-ios

      # ── Compile Go core (platform-aware) and copy into Flutter dirs ───────
      # Windows + Linux: setup.dart's default builds BOTH amd64 + arm64, but
      # the runners are x86_64 with no arm64 cross-toolchain, so the arm64
      # half fails with `gcc_arm64.S: no such instruction`. Pin to amd64
      # explicitly. Android / iOS / macOS handle their own arch matrices
      # internally (NDK / lipo / static lib).
      # Tag/PR runs only restore: caches written on a tag are unreachable by
      # the next tag. warm-release-caches.yml populates these exact identities
      # on master after green source attestation. A hit skips compile. install
      # always copies them into the Flutter tree, including the macOS lipo.
      # Service helpers and the desktop feed overlay are yuelink sources, so
      # the mihomo commit alone is not the cache identity.
      - name: Record Go core cache identity
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git -C core/mihomo rev-parse HEAD)"
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::core/mihomo HEAD is not 40 hex"
            exit 1
          fi
          case "$PLATFORM" in
            windows|linux) arch_scope=amd64 ;;
            android|ios|macos) arch_scope=all ;;
            *)
              echo "::error::unknown platform for Go core cache: $PLATFORM"
              exit 1
              ;;
          esac
          # Staged changes disagree with the checkout commit. A worktree-only
          # diff is not a failure: Windows core.autocrlf can dirty a clean checkout.
          if ! git diff --cached --quiet -- setup.dart setup_install.dart service core \
            || ! git -C core/mihomo diff --cached --quiet; then
            echo "::error::Go core cache inputs are dirty"
            exit 1
          fi
          untracked="$(git ls-files --others --exclude-standard -- setup.dart setup_install.dart service core)"
          untracked_sub="$(git -C core/mihomo ls-files --others --exclude-standard)"
          if [ -n "$untracked" ] || [ -n "$untracked_sub" ]; then
            echo "::error::Go core cache inputs have untracked files"
            exit 1
          fi
          tab="$(printf '\t')"
          listing="$(git ls-files -s -- setup.dart setup_install.dart service core)"
          filtered=""
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in
              *"${tab}core/mihomo"|*"${tab}core/mihomo/"*) continue ;;
              *"${tab}core/build/"*) continue ;;
              *"${tab}service/build/"*) continue ;;
              "") continue ;;
            esac
            filtered="${filtered}${line}"$'\n'
          done < <(printf '%s\n' "$listing")
          if [ -z "$filtered" ]; then
            echo "::error::Go core cache inputs are empty"
            exit 1
          fi
          case "$filtered" in
            *"${tab}setup.dart"*) ;;
            *) echo "::error::setup.dart missing from Go core cache inputs"; exit 1 ;;
          esac
          case "$filtered" in
            *"${tab}setup_install.dart"*) ;;
            *) echo "::error::setup_install.dart missing from Go core cache inputs"; exit 1 ;;
          esac
          case "$filtered" in
            *"${tab}service/"*) ;;
            *) echo "::error::service sources missing from Go core cache inputs"; exit 1 ;;
          esac
          case "$filtered" in
            *"${tab}core/"*) ;;
            *) echo "::error::core sources missing from Go core cache inputs"; exit 1 ;;
          esac
          inputs_sha="$(printf '%s\n' "$filtered" | git hash-object --stdin)"
          if ! [[ "$inputs_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Go core input hash is not 40 hex"
            exit 1
          fi
          {
            echo "CORE_SHA=$sha"
            echo "CORE_ARCH_SCOPE=$arch_scope"
            echo "CORE_INPUTS_SHA=$inputs_sha"
          } >> "$GITHUB_ENV"
      - name: Restore built Go core
        id: go_core_build
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            core/build
            service/build
          key: yue-gocore-v1-${{ matrix.platform }}-${{ runner.os }}-${{ runner.arch }}-${{ env.GO_VERSION }}-${{ env.CORE_ARCH_SCOPE }}-${{ env.CORE_SHA }}-${{ env.CORE_INPUTS_SHA }}-ndk-28.2.13676358-xcode-26.6
      - name: Build & install Go core
        shell: bash
        env:
          GO_CORE_CACHE_HIT: ${{ steps.go_core_build.outputs.cache-hit }}
        run: |
          set -euo pipefail
          build_core() {
            case "${CORE_ARCH_SCOPE:-}" in
              amd64)
                dart setup.dart build -p "$PLATFORM" -a amd64
                ;;
              all)
                dart setup.dart build -p "$PLATFORM"
                ;;
              *)
                echo "::error::Go core arch scope is not amd64 or all"
                exit 1
                ;;
            esac
          }
          libraries_present() {
            case "$PLATFORM" in
              android)
                [ -f core/build/android-arm64/libclash.so ] \
                  && [ -f core/build/android-arm/libclash.so ] \
                  && [ -f core/build/android-x86_64/libclash.so ]
                ;;
              ios)
                [ -f core/build/ios-arm64/libclash.a ] \
                  && [ -f core/build/ios-arm64/libclash.h ]
                ;;
              macos)
                [ -f core/build/macos-arm64/libclash.dylib ] \
                  && [ -f core/build/macos-amd64/libclash.dylib ] \
                  && [ -f service/build/macos-arm64/yuelink-service-helper ] \
                  && [ -f service/build/macos-amd64/yuelink-service-helper ] \
                  && [ -f service/build/macos-arm64/yuelink-mihomo ] \
                  && [ -f service/build/macos-amd64/yuelink-mihomo ]
                ;;
              windows)
                [ -f core/build/windows-amd64/libclash.dll ] \
                  && [ -f service/build/windows-amd64/yuelink-service-helper.exe ] \
                  && [ -f service/build/windows-amd64/yuelink-mihomo.exe ]
                ;;
              linux)
                [ -f core/build/linux-amd64/libclash.so ] \
                  && [ -f service/build/linux-amd64/yuelink-service-helper ] \
                  && [ -f service/build/linux-amd64/yuelink-mihomo ]
                ;;
              *)
                echo "::error::unknown platform $PLATFORM" >&2
                return 2
                ;;
            esac
          }
          if [ "${GO_CORE_CACHE_HIT:-}" != "true" ]; then
            build_core
          elif libraries_present; then
            echo "Go core cache hit for $PLATFORM; skipping compile"
          else
            status=$?
            if [ "$status" -eq 2 ]; then
              exit "$status"
            fi
            echo "Go core cache hit did not restore $PLATFORM libraries; building"
            build_core
          fi
          dart setup.dart install -p "$PLATFORM"

      # ─────────────────────────────────────────────────────────────────────
      # ANDROID
      # ─────────────────────────────────────────────────────────────────────
      - name: Restore Gradle dependency caches
        if: matrix.platform == 'android'
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: yue-sdk-3.47.8-737ba8f885dc774b53b442759999a312c9461e4e-cf636b1dfb818dd6a3ff16e390e93b1a036969c8-3.13.7-${{ hashFiles('pubspec.lock') }}-yue-gradle-v1-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Decode Android keystore
        if: matrix.platform == 'android'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | openssl base64 -d -A > android/app/yuelink.jks
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/android/app/yuelink.jks" >> "$GITHUB_ENV"

      - name: Build APKs (split-per-abi + universal)
        if: matrix.platform == 'android'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build apk --release --split-per-abi \
            --obfuscate --split-debug-info="$RUNNER_TEMP/flutter-symbols/android-split" \
            --build-name="$APP_VERSION" \
            --build-number="$BUILD_NUM"
          flutter build apk --release \
            --obfuscate --split-debug-info="$RUNNER_TEMP/flutter-symbols/android-universal" \
            --build-name="$APP_VERSION" \
            --build-number="$BUILD_NUM"

      - name: Rename APKs
        if: matrix.platform == 'android'
        shell: bash
        run: |
          OUT=build/app/outputs/flutter-apk
          V="$APP_VERSION"
          mkdir -p dist
          cp "$OUT/app-arm64-v8a-release.apk"   "dist/YueLink-${V}-android-arm64-v8a.apk"
          cp "$OUT/app-armeabi-v7a-release.apk" "dist/YueLink-${V}-android-armeabi-v7a.apk"
          cp "$OUT/app-x86_64-release.apk"      "dist/YueLink-${V}-android-x86_64.apk"
          cp "$OUT/app-release.apk"             "dist/YueLink-${V}-android-universal.apk"
          ls -lh dist/

      # 2026-06-02: 锁死 APK 签名指纹, 杜绝"签名冲突"。Android 覆盖安装要求新旧包
      # 同一签名 key, 否则报"应用未安装/签名不一致"。这里强校验每个 APK 都是固定的
      # release key(KEYSTORE_BASE64, CN=YueLink); 任何漂移(keystore 缺失误落 debug
      # fallback / 换了 keystore)→ 构建失败, 绝不发出会和已装版本冲突的包。
      # 换 keystore 必须有意识地同步改这里的 EXPECT_SHA256(并知道老用户需重装一次)。
      - name: Verify APK signature is the pinned release key
        if: matrix.platform == 'android'
        shell: bash
        run: |
          set -euo pipefail
          EXPECT_SHA256="2b117c57ef715f3adb7aa4226a8d23de9a6607eff9f0d3f4df2dbdaa069148cc"
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          [ -n "$sdk_root" ] || { echo "::error::Android SDK root is unset"; exit 1; }
          APKSIGNER=$(find "$sdk_root/build-tools" -mindepth 2 -maxdepth 2 \
            -type f -name apksigner -print | sort -V | tail -1)
          [ -n "$APKSIGNER" ] || { echo "::error::找不到 apksigner"; exit 1; }
          fail=0
          for apk in dist/YueLink-*-android-*.apk; do
            # 取 "...SHA-256 digest: <hex>" 行冒号后的 hex。用 sed 删到最后一个
            # "digest:" 为止,对 apksigner 输出里前缀冒号的数量不敏感(旧 awk -F': '
            # 在新 build-tools 输出格式下会误取标签文字 "certificate SHA-256 digest")。
            got=$("$APKSIGNER" verify --print-certs "$apk" \
                  | sed -n 's/.*SHA-256 digest:[[:space:]]*//p' | sed -n '1p' \
                  | tr 'A-F' 'a-f' | tr -d '[:space:]')
            if [ "$got" != "$EXPECT_SHA256" ]; then
              echo "::error::$(basename "$apk") 签名 $got ≠ 预期 release key — 拒绝发布(防签名冲突)"
              fail=1
            else
              echo "✓ $(basename "$apk") : $got"
            fi
          done
          [ "$fail" = "0" ] || exit 1
          echo "✓ 全部 APK 同一 release key — 覆盖安装不会签名冲突"

      # ─────────────────────────────────────────────────────────────────────
      # iOS — TrollStore / sideload (no codesign, signed with ad-hoc cert)
      # ─────────────────────────────────────────────────────────────────────
      - name: Enable Swift Package Manager (iOS + macOS)
        # This step used to be `--no-enable-swift-package-manager`. Its reason —
        # an xcframework double-resolved by `flutter assemble` and `xcodebuild`,
        # crashing with "already exists in file system" — was triggered by
        # Sentry, which we no longer depend on. That comment ended with "kept
        # rather than re-testing SPM per plugin"; the re-test is done (2026-08-02)
        # and both targets build clean, so the pin goes.
        #
        # Flutter 3.44 uses SwiftPM by default and keeps CocoaPods in maintenance
        # mode; its registry permanently turns read-only on 2026-12-02. The
        # migration is incremental, not a flag day — SPM-capable plugins move to
        # the generated local Swift package and the rest keep going through
        # CocoaPods in the same build. That is why this is worth doing now: it
        # shrinks the December problem from "37 dependencies" to the exact four
        # packages that have no `Package.swift` — 2 on iOS, 3 on macOS, with
        # media_kit_video on both (see CLAUDE.md · Apple build, and
        # scripts/check_cocoapods_residue.sh, which keeps that list honest).
        #
        # Set it explicitly rather than deleting the step. The default is a
        # property of the Flutter release, and a silent default flip in either
        # direction would change how release binaries are linked.
        if: matrix.platform == 'ios' || matrix.platform == 'macos'
        run: flutter config --enable-swift-package-manager

      - name: Build iOS
        if: matrix.platform == 'ios'
        run: |
          flutter build ios --release --no-codesign \
            --obfuscate --split-debug-info="$RUNNER_TEMP/flutter-symbols/ios" \
            --build-name="$APP_VERSION" \
            --build-number="$BUILD_NUM"

      # Lock freshness: the committed Podfile.lock is what
      # scripts/check_cocoapods_residue.sh measures residue FROM. If the
      # build just rewrote it (a new CocoaPods-only plugin slipped in, or
      # SPM was silently off), the committed lock no longer describes the
      # binary we ship and the residue guard is green against stale data.
      - name: Assert iOS Podfile.lock is fresh
        if: matrix.platform == 'ios'
        run: git diff --exit-code ios/Podfile.lock

      - name: Validate iOS container and extension versions
        if: matrix.platform == 'ios'
        shell: bash
        run: |
          set -euo pipefail
          app="build/ios/iphoneos/Runner.app"
          extension="$app/PlugIns/PacketTunnel.appex"
          app_version="$(plutil -extract CFBundleShortVersionString raw "$app/Info.plist")"
          app_build="$(plutil -extract CFBundleVersion raw "$app/Info.plist")"
          extension_version="$(plutil -extract CFBundleShortVersionString raw "$extension/Info.plist")"
          extension_build="$(plutil -extract CFBundleVersion raw "$extension/Info.plist")"
          if ! { [ "$app_version" = "$extension_version" ] &&
                 [ "$app_build" = "$extension_build" ]; }; then
            echo "::error::iOS bundle version mismatch: app=$app_version+$app_build extension=$extension_version+$extension_build"
            exit 1
          fi
          echo "iOS bundle versions match: $app_version+$app_build"

      - name: Sign iOS bundle for TrollStore
        if: matrix.platform == 'ios'
        run: |
          # Inner binaries first, then the .app — order matters for TrollStore.
          codesign --force --sign - \
            --entitlements ios/PacketTunnel/PacketTunnel.entitlements \
            build/ios/iphoneos/Runner.app/PlugIns/PacketTunnel.appex
          for fw in build/ios/iphoneos/Runner.app/Frameworks/*.framework; do
            codesign --force --sign - "$fw"
          done
          for dylib in build/ios/iphoneos/Runner.app/Frameworks/*.dylib; do
            [ -e "$dylib" ] && codesign --force --sign - "$dylib"
          done
          codesign --force --sign - \
            --entitlements ios/Runner/Runner.entitlements \
            build/ios/iphoneos/Runner.app

      - name: Verify iOS signatures and VPN entitlements
        if: matrix.platform == 'ios'
        shell: bash
        run: |
          set -euo pipefail
          app="build/ios/iphoneos/Runner.app"
          extension="$app/PlugIns/PacketTunnel.appex"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --verify --strict --verbose=2 "$extension"

          runner_entitlements="$RUNNER_TEMP/yuelink-runner-entitlements.plist"
          tunnel_entitlements="$RUNNER_TEMP/yuelink-tunnel-entitlements.plist"
          codesign -d --entitlements :- "$app" \
            > "$runner_entitlements" 2>/dev/null
          codesign -d --entitlements :- "$extension" \
            > "$tunnel_entitlements" 2>/dev/null
          for entitlements in "$runner_entitlements" "$tunnel_entitlements"; do
            group=$(/usr/libexec/PlistBuddy \
              -c 'Print :com.apple.security.application-groups:0' \
              "$entitlements")
            provider=$(/usr/libexec/PlistBuddy \
              -c 'Print :com.apple.developer.networking.networkextension:0' \
              "$entitlements")
            if ! { [ "$group" = "group.com.yueto.yuelink" ] &&
                   [ "$provider" = "packet-tunnel-provider" ]; }; then
              echo "::error::iOS VPN entitlement contract mismatch"
              exit 1
            fi
          done
          echo "iOS app + PacketTunnel signatures and VPN entitlements verified"

      - name: Package iOS .ipa
        if: matrix.platform == 'ios'
        shell: bash
        run: |
          mkdir -p dist
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          IPA="YueLink-${APP_VERSION}-ios.ipa"
          zip -r --symlinks "$IPA" Payload
          mv "$IPA" "$GITHUB_WORKSPACE/dist/"
          ls -lh "$GITHUB_WORKSPACE/dist/$IPA"

      # ─────────────────────────────────────────────────────────────────────
      # macOS — universal .dmg with squircle icon and optional notarization
      # ─────────────────────────────────────────────────────────────────────
      - name: Refresh icons + DMG background
        if: matrix.platform == 'macos'
        run: dart run tool/round_appicon.dart

      - name: Enable macOS desktop
        if: matrix.platform == 'macos'
        run: flutter config --enable-macos-desktop

      - name: Build macOS
        if: matrix.platform == 'macos'
        run: |
          YUELINK_REQUIRE_ROOT_PREFS=1 bash scripts/ci/test_native_network_settings.sh
          (cd service && CGO_ENABLED=1 go test -mod=readonly -race ./...)
          flutter build macos --release \
            --obfuscate --split-debug-info="$RUNNER_TEMP/flutter-symbols/macos" \
            --build-name="$APP_VERSION" \
            --build-number="$BUILD_NUM"

      # Same lock-freshness assertion as the iOS job — see that step's
      # comment. Guards the residue guard's input.
      - name: Assert macOS Podfile.lock is fresh
        if: matrix.platform == 'macos'
        run: git diff --exit-code macos/Podfile.lock

      - name: Verify packaged macOS privacy declarations
        if: matrix.platform == 'macos'
        run: python3 scripts/ci/verify_macos_privacy.py --app build/macos/Build/Products/Release/YueLink.app

      - name: Resolve actual macOS signing and notarization mode
        if: matrix.platform == 'macos'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          signing_configured=0
          notarization_configured=0
          if [ -n "${APPLE_CERTIFICATE_BASE64:-}" ] &&
             [ -n "${APPLE_CERTIFICATE_PASSWORD:-}" ] &&
             [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
            signing_configured=1
          fi
          if [ "$signing_configured" -eq 1 ] &&
             [ -n "${APPLE_ID:-}" ] &&
             [ -n "${APPLE_PASSWORD:-}" ] &&
             [ -n "${APPLE_TEAM_ID:-}" ]; then
            notarization_configured=1
          fi
          echo "MAC_SIGNING_CONFIGURED=$signing_configured" >> "$GITHUB_ENV"
          echo "MAC_NOTARIZATION_CONFIGURED=$notarization_configured" >> "$GITHUB_ENV"
          if [ "$notarization_configured" -eq 1 ]; then
            echo "MAC_SIGNING_MODE=developer-id-notarized" >> "$GITHUB_ENV"
          elif [ "$signing_configured" -eq 1 ]; then
            echo "MAC_SIGNING_MODE=developer-id-not-notarized" >> "$GITHUB_ENV"
            echo "::warning::macOS Developer ID is configured but notarization is not; publishing as direct sideload, not notarized"
          else
            echo "MAC_SIGNING_MODE=ad-hoc-not-notarized" >> "$GITHUB_ENV"
            echo "::warning::macOS publisher identity is absent; publishing an ad-hoc signed, not notarized direct-sideload build"
          fi

      - name: Import signing certificate (macOS)
        if: matrix.platform == 'macos' && env.MAC_SIGNING_CONFIGURED == '1'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain login.keychain
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 \
            -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f /tmp/cert.p12
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain

      - name: Sign YueLink.app with hardened runtime
        if: matrix.platform == 'macos' && env.MAC_SIGNING_CONFIGURED == '1'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          APP="build/macos/Build/Products/Release/YueLink.app"
          find "$APP/Contents/Frameworks" -type f -name '*.dylib' \
            -exec codesign --force --options runtime --timestamp \
                  --sign "$APPLE_SIGNING_IDENTITY" {} \; 2>/dev/null || true
          find "$APP/Contents/Frameworks" -type d -name '*.framework' \
            -exec codesign --force --options runtime --timestamp \
                  --sign "$APPLE_SIGNING_IDENTITY" {} \; 2>/dev/null || true
          codesign --force --options runtime --timestamp \
            --entitlements macos/Runner/Release.entitlements \
            --sign "$APPLE_SIGNING_IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Ad-hoc sign YueLink.app (no Apple account — free Gatekeeper relief)
        if: matrix.platform == 'macos' && env.MAC_SIGNING_CONFIGURED != '1'
        run: |
          # Without a paid Developer ID we can't notarize, but an *ad-hoc*
          # signature (codesign --sign -) still gives every Mach-O a valid
          # signature. That matters on Apple Silicon: a downloaded, totally
          # unsigned arm64 .app is rejected outright as "已损坏 / is damaged"
          # and won't open at all. Ad-hoc signing downgrades that to the normal
          # "unidentified developer" Gatekeeper prompt, which the user can
          # bypass via right-click → Open (or the bundled 修复无法打开.command).
          # Sign inside-out: nested code first, bundle last. No entitlements —
          # macOS YueLink uses networksetup + App Support JSON, not
          # entitlement-gated APIs, and ad-hoc + restricted entitlements can
          # break launch.
          APP="build/macos/Build/Products/Release/YueLink.app"
          find "$APP/Contents/Frameworks" -type f \( -name '*.dylib' -o -name '*.so' \) \
            -exec codesign --force --timestamp=none --sign - {} \; 2>/dev/null || true
          find "$APP/Contents/Frameworks" -type d -name '*.framework' \
            -exec codesign --force --timestamp=none --sign - {} \; 2>/dev/null || true
          codesign --force --timestamp=none --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Package macOS .dmg
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          CREATE_DMG_VERSION=1.3.0
          CREATE_DMG_SHA256=c50d2bc97c3d6292642bac55f530d247eaf4bf65ee605f26b4caf339383e381c
          curl --fail --show-error --silent --location --proto '=https' --tlsv1.2 \
            "https://github.com/create-dmg/create-dmg/archive/refs/tags/v${CREATE_DMG_VERSION}.tar.gz" \
            -o /tmp/create-dmg.tar.gz
          echo "${CREATE_DMG_SHA256}  /tmp/create-dmg.tar.gz" | shasum -a 256 -c -
          tar -xzf /tmp/create-dmg.tar.gz -C /tmp
          CREATE_DMG="/tmp/create-dmg-${CREATE_DMG_VERSION}/create-dmg"
          test -x "$CREATE_DMG"
          DMG_SRC=dmg_source
          mkdir -p "$DMG_SRC" dist
          cp -R build/macos/Build/Products/Release/YueLink.app "$DMG_SRC/"
          cp assets/fix-gatekeeper.command "$DMG_SRC/修复无法打开.command"
          chmod +x "$DMG_SRC/修复无法打开.command"

          # Compose .icns for the DMG volume icon (Finder sidebar + Desktop)
          ICONSET=/tmp/yuelink_volicon.iconset
          rm -rf "$ICONSET" && mkdir -p "$ICONSET"
          ICONS=macos/Runner/Assets.xcassets/AppIcon.appiconset
          cp "$ICONS/app_icon_16.png"   "$ICONSET/icon_16x16.png"
          cp "$ICONS/app_icon_32.png"   "$ICONSET/icon_16x16@2x.png"
          cp "$ICONS/app_icon_32.png"   "$ICONSET/icon_32x32.png"
          cp "$ICONS/app_icon_64.png"   "$ICONSET/icon_32x32@2x.png"
          cp "$ICONS/app_icon_128.png"  "$ICONSET/icon_128x128.png"
          cp "$ICONS/app_icon_256.png"  "$ICONSET/icon_128x128@2x.png"
          cp "$ICONS/app_icon_256.png"  "$ICONSET/icon_256x256.png"
          cp "$ICONS/app_icon_512.png"  "$ICONSET/icon_256x256@2x.png"
          cp "$ICONS/app_icon_512.png"  "$ICONSET/icon_512x512.png"
          cp "$ICONS/app_icon_1024.png" "$ICONSET/icon_512x512@2x.png"
          iconutil -c icns -o /tmp/yuelink_volicon.icns "$ICONSET"

          DMG_NAME="YueLink-${APP_VERSION}-macos-universal.dmg"
          set +e
          "$CREATE_DMG" \
            --volname "YueLink" \
            --volicon "/tmp/yuelink_volicon.icns" \
            --background "assets/dmg_background.png" \
            --window-pos 200 120 --window-size 660 400 --icon-size 80 \
            --icon "YueLink.app" 180 170 \
            --app-drop-link 480 170 \
            --icon "修复无法打开.command" 330 340 \
            --hide-extension "YueLink.app" \
            "dist/$DMG_NAME" "$DMG_SRC"
          DMG_EXIT=$?
          set -e
          # exit 2 = DMG created but no signing identity (expected in CI)
          if [ $DMG_EXIT -ne 0 ] && [ $DMG_EXIT -ne 2 ]; then
            echo "ERROR: create-dmg failed ($DMG_EXIT)"; exit 1
          fi
          [ -f "dist/$DMG_NAME" ] || { echo "ERROR: DMG missing"; exit 1; }
          ls -lh "dist/$DMG_NAME"

      - name: Sign and verify macOS DMG
        if: matrix.platform == 'macos' && env.MAC_SIGNING_CONFIGURED == '1'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          DMG_NAME="YueLink-${APP_VERSION}-macos-universal.dmg"
          codesign --force --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" "dist/$DMG_NAME"
          codesign --verify --strict --verbose=2 "dist/$DMG_NAME"

      - name: Notarize DMG
        if: matrix.platform == 'macos' && env.MAC_NOTARIZATION_CONFIGURED == '1'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG_NAME="YueLink-${APP_VERSION}-macos-universal.dmg"
          xcrun notarytool submit "dist/$DMG_NAME" \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait --timeout 30m
          xcrun stapler staple "dist/$DMG_NAME"
          xcrun stapler validate "dist/$DMG_NAME"

      - name: Clean up signing keychain
        if: matrix.platform == 'macos' && always() && env.MAC_SIGNING_CONFIGURED == '1'
        run: security delete-keychain build.keychain 2>/dev/null || true

      # ─────────────────────────────────────────────────────────────────────
      # WINDOWS — Inno Setup installer + portable zip
      # ─────────────────────────────────────────────────────────────────────
      - name: Bundle Wintun (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          # Pulls upstream Wintun zip, sha256-verifies against the pinned
          # values in windows/third_party/wintun/wintun.sha256, and stages
          # the amd64 + arm64 DLLs so windows/CMakeLists.txt can install
          # them. Without this the desktop_tun_diagnostics surfaces
          # missing_driver and the UI shows "Wintun 驱动缺失".
          ./scripts/check_windows_wintun_bundle.ps1 -Download

      - name: Build Windows
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          flutter test test/services/native_proxy_settings_test.dart
          flutter config --enable-windows-desktop
          flutter build windows --release \
            --obfuscate --split-debug-info="$RUNNER_TEMP/flutter-symbols/windows" \
            --build-name="$APP_VERSION" \
            --build-number="$BUILD_NUM"

      - name: Verify Wintun bundle (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          # Post-build: confirm wintun.dll landed next to yuelink.exe with
          # a hash matching one of the pinned arch entries. Release-gate.
          ./scripts/check_windows_wintun_bundle.ps1 -Verify `
            -BundleDir build/windows/x64/runner/Release

      # R4.2 named-pipe helper channel: the only real-Windows evidence for it.
      # Runs the Windows-only Go transport tests (DACL, first-instance,
      # loopback stays closed, legacy config still served) and the Dart
      # kernel32 client against the real listener. Red here fails the build
      # before release/promotion — a broken pipe would strand every Windows
      # TUN user after the in-app helper update.
      - name: Windows helper named-pipe runtime tests
        if: matrix.platform == 'windows'
        shell: bash
        working-directory: service
        env:
          YUELINK_DART_PIPE_INTEROP: '1'
        run: |
          go test -count=1 -timeout 15m -v \
            -run 'NamedPipe|LegacyConfig|DartPipeClientInterop|UpgradePath|SelectWindowsTransport' .

      # The real elevated install chain (v1.3.85): `service-install` builds
      # C:\ProgramData\YueLink\Service with its protected ACL, registers and
      # starts the SCM service, the owner reaches it on the named pipe, then
      # `service-update` and `service-uninstall` run over the top. v1.3.83
      # shipped an install path that no Windows machine had executed before
      # users did; this step is that execution. Runners are elevated.
      - name: Windows helper install chain (real SCM)
        if: matrix.platform == 'windows'
        shell: bash
        working-directory: service
        env:
          YUELINK_SERVICE_INSTALL_E2E: '1'
        run: |
          go test -count=1 -timeout 10m -v -run 'ServiceInstallE2E' .

      - name: Bundle libclash + service binaries (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $releaseDir = "build\windows\x64\runner\Release"
          $dllSrc = "windows\libs\amd64\libclash.dll"
          if ((Test-Path $dllSrc) -and -not (Test-Path "$releaseDir\libclash.dll")) {
            Copy-Item $dllSrc "$releaseDir\libclash.dll"
          }
          if (-not (Test-Path "$releaseDir\libclash.dll")) {
            Write-Error "libclash.dll missing from Release dir"; exit 1
          }
          $svcSrc = "service\build\windows-amd64"
          foreach ($bin in @("yuelink-service-helper.exe", "yuelink-mihomo.exe")) {
            if (Test-Path "$svcSrc\$bin") {
              Copy-Item "$svcSrc\$bin" "$releaseDir\$bin"
            } else {
              Write-Error "$bin missing from $svcSrc"; exit 1
            }
          }

      - name: Sign Windows binaries
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERT_BASE64)) {
            "WINDOWS_SIGNING_MODE=unsigned" | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Warning "Windows publisher certificate absent; binaries remain authentically reported as unsigned."
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERT_PASSWORD)) {
            "WINDOWS_SIGNING_MODE=unsigned" | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Warning "Windows publisher certificate password absent; binaries remain authentically reported as unsigned."
            exit 0
          }
          $certPath = Join-Path $env:RUNNER_TEMP "yuelink-codesign.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
          "WINDOWS_CERT_PATH=$certPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          "WINDOWS_SIGNING_MODE=authenticode" | Out-File -FilePath $env:GITHUB_ENV -Append

          $releaseDir = "build\windows\x64\runner\Release"
          $targets = @(
            "$releaseDir\yuelink.exe",
            "$releaseDir\yuelink-service-helper.exe",
            "$releaseDir\yuelink-mihomo.exe"
          ) | Where-Object { Test-Path $_ }
          foreach ($target in $targets) {
            & signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com `
              /f $certPath /p $env:WINDOWS_CERT_PASSWORD $target
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & signtool verify /pa /v $target
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Generate Inno Setup wizard images
        if: matrix.platform == 'windows'
        shell: bash
        run: dart run tool/round_appicon.dart

      - name: Download VC++ 2015-2022 Redistributable (bundled into installer)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $vcRedist = "windows\vc_redist.x64.exe"
          if (-not (Test-Path $vcRedist)) {
            Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" `
              -OutFile $vcRedist -UseBasicParsing
          }
          $expected = "cc0ff0eb1dc3f5188ae6300faef32bf5beeba4bdd6e8e445a9184072096b713b"
          $actual = (Get-FileHash -Algorithm SHA256 $vcRedist).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            Write-Error "vc_redist.x64.exe SHA-256 mismatch: $actual"
            exit 1
          }
          Get-Item $vcRedist | Select-Object Name, Length

      - name: Build Windows installer + portable zip
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $version = $env:APP_VERSION
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          iscc "/DMyAppVersion=$version" "/DMyAppArch=amd64" windows\installer.iss
          if ($env:WINDOWS_CERT_PATH -and (Test-Path $env:WINDOWS_CERT_PATH)) {
            $installer = Get-ChildItem windows\YueLink-*.exe | Select-Object -First 1
            if ($installer) {
              & signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com `
                /f $env:WINDOWS_CERT_PATH /p $env:WINDOWS_CERT_PASSWORD $installer.FullName
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              & signtool verify /pa /v $installer.FullName
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
          Get-ChildItem windows\YueLink-*.exe | Copy-Item -Destination dist\
          $releaseDir = "build\windows\x64\runner\Release"
          $zipName = "dist\YueLink-$version-windows-amd64-portable.zip"
          Compress-Archive -Path "$releaseDir\*" -DestinationPath $zipName -Force
          Get-ChildItem dist\

      - name: Verify actual Windows signing state
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $releaseDir = "build\windows\x64\runner\Release"
          $targets = @(
            "$releaseDir\yuelink.exe",
            "$releaseDir\yuelink-service-helper.exe",
            "$releaseDir\yuelink-mihomo.exe"
          )
          $installer = Get-ChildItem dist\YueLink-*-windows-amd64-setup.exe | Select-Object -First 1
          if ($installer) { $targets += $installer.FullName }
          foreach ($target in $targets) {
            if (-not (Test-Path $target)) { Write-Error "signing target missing: $target"; exit 1 }
            $status = (Get-AuthenticodeSignature $target).Status
            if ($env:WINDOWS_SIGNING_MODE -eq "authenticode") {
              if ($status -ne "Valid") { Write-Error "$target Authenticode status is $status, expected Valid"; exit 1 }
            } elseif ($status -ne "NotSigned") {
              Write-Error "$target is reported unsigned but Authenticode status is $status"; exit 1
            }
          }
          Write-Host "Windows signing mode verified: $env:WINDOWS_SIGNING_MODE"

      - name: Verify and exercise packaged Windows media
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          set -- dist/YueLink-*-windows-amd64-portable.zip
          [ "$#" -eq 1 ] && [ -f "$1" ]
          python3 scripts/native_tests/windows_media/verify.py --archive "$1" --output "$RUNNER_TEMP/windows-media-inventory.json"
          cmake -S scripts/native_tests/media -B "$RUNNER_TEMP/windows-media-probe" -A x64 \
            -DMPV_ROOT="$GITHUB_WORKSPACE/build/windows/x64/libmpv" \
            -DANGLE_ROOT="$GITHUB_WORKSPACE/build/windows/x64/ANGLE"
          cmake --build "$RUNNER_TEMP/windows-media-probe" --config Release --parallel 2
          "$RUNNER_TEMP/windows-media-probe/Release/shared-texture-probe.exe"
          python3 scripts/native_tests/media/playback.py \
            --probe "$RUNNER_TEMP/windows-media-probe/Release/player-probe.exe" \
            --fixtures scripts/native_tests/media/fixtures \
            --work "$RUNNER_TEMP/windows-media-playback" --legacy-subtitles

      # ─────────────────────────────────────────────────────────────────────
      # LINUX — AppImage only (drops .deb / .rpm — was sprawling for no win)
      # ─────────────────────────────────────────────────────────────────────
      - name: Refresh Linux squircle icon
        if: matrix.platform == 'linux'
        run: dart run tool/round_appicon.dart

      - name: Build Linux
        if: matrix.platform == 'linux'
        run: |
          export PATH="/usr/bin:$PATH"
          bash scripts/ci/test_native_network_settings.sh
          curl-config --features | grep -q AsynchDNS
          flutter config --enable-linux-desktop
          flutter build linux --release \
            --obfuscate --split-debug-info="$RUNNER_TEMP/flutter-symbols/linux" \
            --build-name="$APP_VERSION" \
            --build-number="$BUILD_NUM"

      - name: Bundle service binaries + create AppImage
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          BUNDLE_DIR=$(find build/linux -maxdepth 4 -type d -name bundle | sed -n '1p')
          if [ -z "$BUNDLE_DIR" ]; then
            echo "ERROR: bundle dir not found"; find build/linux -type d | sed -n '1,20p'; exit 1
          fi

          # Copy service mode binaries next to the main yuelink binary
          SVC_SRC="service/build/linux-amd64"
          for bin in yuelink-service-helper yuelink-mihomo; do
            if [ -f "$SVC_SRC/$bin" ]; then
              cp "$SVC_SRC/$bin" "$BUNDLE_DIR/$bin"
              chmod +x "$BUNDLE_DIR/$bin"
            else
              echo "ERROR: $bin missing from $SVC_SRC"; exit 1
            fi
          done

          # Fetch appimagetool and assemble the AppDir
          curl -fSL -o /usr/local/bin/appimagetool \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          echo "b90f4a8b18967545fda78a445b27680a1642f1ef9488ced28b65398f2be7add2  /usr/local/bin/appimagetool" \
            | sha256sum -c -
          chmod +x /usr/local/bin/appimagetool

          VERSION="$APP_VERSION"
          APPDIR="build/AppDir"
          mkdir -p dist
          OUTPUT="dist/YueLink-${VERSION}-linux-amd64.AppImage"

          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/applications" \
                   "$APPDIR/usr/share/icons/hicolor/256x256/apps"
          cp -r "$BUNDLE_DIR/." "$APPDIR/usr/bin/"

          cat > "$APPDIR/usr/share/applications/yuelink.desktop" << 'DESKTOP'
          [Desktop Entry]
          Name=YueLink
          Comment=Cross-platform proxy client
          Exec=yuelink
          Icon=yuelink
          Type=Application
          Categories=Network;
          StartupNotify=true
          DESKTOP

          if [ -f "assets/icon_desktop.png" ]; then
            cp "assets/icon_desktop.png" "$APPDIR/usr/share/icons/hicolor/256x256/apps/yuelink.png"
            cp "assets/icon_desktop.png" "$APPDIR/yuelink.png"
          fi

          cat > "$APPDIR/AppRun" << 'APPRUN'
          #!/usr/bin/env bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          export LD_LIBRARY_PATH="${HERE}/usr/bin/lib:${LD_LIBRARY_PATH:-}"
          exec "${HERE}/usr/bin/yuelink" "$@"
          APPRUN
          chmod +x "$APPDIR/AppRun"
          ln -sf "usr/share/applications/yuelink.desktop" "$APPDIR/yuelink.desktop"

          # ── Bundle libmpv2 + transitive deps (issue #3) ──────────────
          # Keep libmpv and its reviewed media closure inside the AppImage;
          # the host does not need to install a matching media stack.
          # Use linuxdeploy to copy libmpv.so.2 + its non-system
          # transitive deps (ffmpeg, libass, libplacebo, …) into
          # $APPDIR/usr/bin/lib so AppRun's LD_LIBRARY_PATH picks them
          # up before the system loader. Adds ~50 MB to the AppImage
          # and retains the runner's glibc baseline; bundling media does not
          # make an Ubuntu 24.04 binary compatible with older glibc hosts.
          curl -fSL -o /tmp/linuxdeploy.AppImage \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage"
          echo "c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  /tmp/linuxdeploy.AppImage" \
            | sha256sum -c -
          chmod +x /tmp/linuxdeploy.AppImage
          # GitHub runners disable FUSE; --appimage-extract-and-run is
          # the documented workaround for AppImage tools in CI.
          LIBMPV_PATH="$YUELINK_MEDIA_PREFIX/lib/libmpv.so.2"
          test -f "$LIBMPV_PATH" || { echo "Missing reviewed native mpv prefix" >&2; exit 1; }
          echo "Bundling libmpv from: $LIBMPV_PATH"
          # Preserve the reviewed native bytes. linuxdeploy resolves the
          # remaining system dependencies; the exact rebuilt media libraries
          # are restored below after its rpath processing.
          NO_STRIP=1 APPIMAGE_EXTRACT_AND_RUN=1 \
            /tmp/linuxdeploy.AppImage \
              --appdir "$APPDIR" \
              --executable "$APPDIR/usr/bin/yuelink" \
              --library "$LIBMPV_PATH"
          # linuxdeploy puts libs under $APPDIR/usr/lib by default; our
          # AppRun expects them under usr/bin/lib (matches the existing
          # service-binary layout). Mirror the libs there.
          if [ -d "$APPDIR/usr/lib" ]; then
            mkdir -p "$APPDIR/usr/bin/lib"
            cp -rL "$APPDIR/usr/lib/." "$APPDIR/usr/bin/lib/"
          fi

          python3 scripts/linux_media/package.py --prefix "$YUELINK_MEDIA_PREFIX" --appdir "$APPDIR" --output "$RUNNER_TEMP/linux-media-packaged.json"
          cmake -S scripts/native_tests/media -B "$RUNNER_TEMP/linux-media-probe" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/linux-media-probe" --parallel 2
          # No physical GPU on this runner. Exercise the GL API with Mesa's
          # deterministic software rasterizer and the packaged DSO closure.
          GALLIUM_DRIVER=softpipe xvfb-run -a env LD_LIBRARY_PATH="$APPDIR/usr/bin/lib" \
            python3 scripts/native_tests/media/playback.py \
              --probe "$RUNNER_TEMP/linux-media-probe/player-probe" \
              --fixtures scripts/native_tests/media/fixtures \
              --work "$RUNNER_TEMP/linux-packaged-playback" --legacy-subtitles

          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 \
            appimagetool "$APPDIR" "$OUTPUT"
          ls -lh "$OUTPUT"

      - name: Verify packaged Android media and 16 KB alignment
        if: matrix.platform == 'android'
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for artifact in dist/*.apk; do
            [ -f "$artifact" ] || continue
            python3 scripts/native/android/verify.py --apk "$artifact" --output "$RUNNER_TEMP/android-media-$(basename "$artifact").json"
            found=$((found + 1))
          done
          [ "$found" -gt 0 ]

      - name: Verify packaged iOS native delegation
        if: matrix.platform == 'ios'
        shell: bash
        run: |
          set -euo pipefail
          set -- dist/YueLink-*-ios.ipa
          if ! { [ "$#" -eq 1 ] && [ -f "$1" ]; }; then
            echo "Expected exactly one iOS IPA" >&2
            exit 1
          fi
          python3 scripts/ci/verify_ios_core_delegation.py --artifact "$1" --output "$RUNNER_TEMP/yuelink-ios-native-linkage.json"

      - name: Exercise native core from packaged desktop artifact
        if: matrix.platform == 'macos' || matrix.platform == 'windows' || matrix.platform == 'linux'
        shell: bash
        env:
          CORE_PROBE_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          case "$CORE_PROBE_PLATFORM" in
            macos) set -- dist/YueLink-*-macos-universal.dmg ;;
            windows) set -- dist/YueLink-*-windows-amd64-portable.zip ;;
            linux) set -- dist/YueLink-*-linux-amd64.AppImage ;;
            *) echo "::error::unexpected desktop core probe platform"; exit 1 ;;
          esac
          if ! { [ "$#" -eq 1 ] && [ -f "$1" ]; }; then
            echo "::error::expected one exact packaged desktop artifact"
            exit 1
          fi
          python3 scripts/performance/core_package_probe.py \
            --artifact "$1" --require-leases --output "$RUNNER_TEMP/yuelink-packaged-core-runtime.json"

      - name: Decide Xcode compilation cache save
        id: xcode_cache_save
        if: success() && (matrix.platform == 'ios' || matrix.platform == 'macos')
        shell: bash
        env:
          XCODE_CACHE_HIT: ${{ steps.xcode_cache_restore.outputs.cache-hit }}
        run: |
          set -euo pipefail
          cache="$HOME/Library/Developer/Xcode/DerivedData/CompilationCache.noindex"
          if [ "$XCODE_CACHE_HIT" = "true" ]; then
            echo "save=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ! -d "$cache" ]; then
            echo "save=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Count logical tar bytes, including sparse contents and headers.
          # Reserve 1% + 1 MiB for compression framing/manifest overhead;
          # this deliberately skips borderline archives below the 2 GiB cap.
          bytes="$(tar -cf - -C "$cache" . | wc -c | tr -d '[:space:]')"
          bytes=$((bytes + bytes / 100 + 1048576))
          if python3 scripts/ci/link_platform_cache.py xcode-save --bytes "$bytes"; then
            echo "save=true" >> "$GITHUB_OUTPUT"
          else
            echo "save=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save Xcode compilation cache
        if: github.ref == 'refs/heads/master' && steps.xcode_cache_save.outputs.save == 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Developer/Xcode/DerivedData/CompilationCache.noindex
          key: yue-sdk-3.47.8-737ba8f885dc774b53b442759999a312c9461e4e-cf636b1dfb818dd6a3ff16e390e93b1a036969c8-3.13.7-${{ hashFiles('pubspec.lock') }}-yue-xcode-cc-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-${{ github.sha }}
      - name: Record native media validation evidence
        if: always()
        shell: bash
        run: |
          python3 - <<'PYPROOF'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          patterns = ('windows-media-inventory.json', 'windows-media-playback/proof.json',
                      'linux-media-packaged.json', 'linux-packaged-playback/proof.json',
                      'android-media-*.json')
          for pattern in patterns:
              for path in sorted(root.glob(pattern)):
                  print('NATIVE_MEDIA_EVIDENCE ' + str(path.relative_to(root)))
                  print(json.dumps(json.loads(path.read_text()), indent=2))
          PYPROOF

      # ── 2026-06-01 解耦发布: 平台产物直接传 R2, release job 从 R2 取, 不再依赖
      #    GHA artifact。根因: GitHub Actions 存储配额"计量"每 6-12h 才重算, 即使删光
      #    旧 artifact, 配额表仍显示满 → 所有 upload-artifact 失败(含构建产物)→ 卡发布。
      #    走 R2(本就是分发通道)彻底绕开这个计量滞后。aws s3 sync 跨 win/mac/linux 通用。
      # Provenance attestation runs HERE (build job), not in release: the
      # release job downloads sidecars + identity records (binaries live in R2).
      - name: Record exact sideload identity
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          # Keep the matrix value explicit at the step boundary. Besides
          # documenting provenance input, this lets static shell analysis
          # prove PLATFORM is assigned before the strict-mode script reads it.
          PLATFORM: ${{ matrix.platform }}
          ATTESTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          version="${APP_VERSION}"
          tag="${GITHUB_REF_NAME}"
          source_commit="$(git rev-parse HEAD)"
          [ "$source_commit" = "$ATTESTED_SOURCE_COMMIT" ] || {
            echo "::error::checked-out source commit $source_commit does not match attested source $ATTESTED_SOURCE_COMMIT"
            exit 1
          }
          [ "${tag#v}" = "$version" ] || {
            echo "::error::artifact version $version does not match tag $tag"
            exit 1
          }

          # PLATFORM is injected from the matrix by the step-level env above.
          # Static shell analysis cannot model GitHub Actions env injection.
          # shellcheck disable=SC2153
          platform="${PLATFORM:?matrix platform is missing}"
          case "$platform" in
            android) signing_mode=android-release-key; notarization=not-applicable ;;
            ios) signing_mode=ad-hoc; notarization=not-notarized ;;
            macos) signing_mode="${MAC_SIGNING_MODE:?}"; notarization=not-notarized
              [ "$signing_mode" = developer-id-notarized ] && notarization=notarized ;;
            windows) signing_mode="${WINDOWS_SIGNING_MODE:?}"; notarization=not-applicable ;;
            linux) signing_mode=unsigned; notarization=not-applicable ;;
            *) echo "::error::unknown release platform $platform"; exit 1 ;;
          esac

          # macOS runners still ship Bash 3.2, so keep this step free of
          # mapfile/readarray. Every platform runner has jq.
          artifacts_json="$(find dist -maxdepth 1 -type f -print \
            | sed 's#^.*/##' | LC_ALL=C sort \
            | jq -Rsc 'split("\n")[:-1]')"
          [ "$(jq 'length' <<<"$artifacts_json")" -gt 0 ] || {
            echo "::error::$platform produced no artifact"
            exit 1
          }
          metadata="dist/YueLink-${version}-${platform}-RELEASE.json"
          notice="dist/YueLink-${version}-${platform}-INSTALL-NOTICE.txt"
          jq -n \
            --arg tag "$tag" --arg version "$version" --arg sourceCommit "$source_commit" \
            --arg platform "$platform" --arg signingMode "$signing_mode" \
            --arg notarization "$notarization" --argjson artifacts "$artifacts_json" \
            '{schemaVersion:1,distribution:"direct-sideload",tag:$tag,version:$version,sourceCommit:$sourceCommit,platform:$platform,signingMode:$signingMode,notarization:$notarization,storeSubmission:false,artifacts:$artifacts}' \
            > "$metadata"
          {
            echo 'Distribution: direct sideload'
            echo "Version: $version"
            echo "Tag: $tag"
            echo "Source commit: $source_commit"
            echo "Publisher signing: $signing_mode"
            echo "Apple notarization: $notarization"
            echo 'Store submission: no'
            echo 'No older binary was substituted for an unavailable platform.'
          } > "$notice"
          echo "::notice::$platform release identity: signing=$signing_mode notarization=$notarization"

      # `subject-path: dist/*` there matched nothing → "Could not find subject"
      # (was continue-on-error, so it silently produced NO attestation). At
      # this point dist/ holds exactly this platform's freshly-built binaries
      # (the .sha256 sidecars are generated inside the publish step below), so
      # each platform attests its own artifact.
      - name: Encrypt and retain Flutter split symbols
        shell: bash
        env:
          YUEOPS_KEYVAULT_BREAKGLASS_RECIPIENT: ${{ vars.YUEOPS_KEYVAULT_BREAKGLASS_RECIPIENT }}
          YUEOPS_KEYVAULT_VERIFIER_RECIPIENT: ${{ vars.YUEOPS_KEYVAULT_VERIFIER_RECIPIENT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_APP_KEY }}
          R2_ENDPOINT: https://1e192a89cfaab399d211bb1dfe77a5cd.r2.cloudflarestorage.com
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          SYMBOL_PLATFORM: ${{ matrix.platform }}
          SYMBOL_SOURCE: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          umask 077
          # Same two public recipients and backup bucket as the existing key
          # recovery workflow. No private identity enters this public builder.
          GOFLAGS='' GOBIN="$RUNNER_TEMP/age-bin" go install filippo.io/age/cmd/age@v1.3.2 filippo.io/age/cmd/age-keygen@v1.3.2
          age_tool="$RUNNER_TEMP/age-bin/age"
          if [ "$RUNNER_OS" = Windows ]; then age_tool="$age_tool.exe"; fi
          export PATH="$RUNNER_TEMP/age-bin:$PATH"
          [ "$(git rev-parse HEAD)" = "$SYMBOL_SOURCE" ]
          archive="$RUNNER_TEMP/flutter-symbols-${SYMBOL_PLATFORM}.tar.age"
          python3 scripts/ci/archive_flutter_symbols.py archive \
            --symbols "$RUNNER_TEMP/flutter-symbols" --dist dist \
            --output "$archive" --source "$SYMBOL_SOURCE" \
            --platform "$SYMBOL_PLATFORM" --age "$age_tool" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          prefix="s3://yueops-backup/yuelink-symbols/$SYMBOL_SOURCE/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/$SYMBOL_PLATFORM"
          for file in "$archive" "$archive.json"; do
            aws s3 cp "$file" "$prefix/$(basename "$file")" \
              --endpoint-url "$R2_ENDPOINT" --no-progress --only-show-errors
            aws s3 cp "$prefix/$(basename "$file")" "$file.readback" \
              --endpoint-url "$R2_ENDPOINT" --no-progress --only-show-errors
            cmp "$file" "$file.readback"
          done

      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: 'dist/*'

      - name: Publish binaries to R2 (yuelink-dist/<tag>/)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_APP_KEY }}
          R2_ENDPOINT: https://1e192a89cfaab399d211bb1dfe77a5cd.r2.cloudflarestorage.com
          R2_ACCOUNT_ID: 1e192a89cfaab399d211bb1dfe77a5cd
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_CONFIG_TOKEN }}
          AWS_DEFAULT_REGION: auto
          # R2 + aws-cli v2(runner 自带新版)默认发 CRC32 checksum 头, R2 对部分
          # 操作会拒 → when_required 只在必要时算/校验, 规避不兼容。
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          BUCKET: yuelink-dist
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          bash scripts/ci/publish_immutable_r2.sh
          echo "✓ 已上传本平台安装包+sha256 到 R2 ($BUCKET/$TAG/)"

      # ── 2026-06-01: 不再上传 GHA artifact。分发与 release job 取件全走 R2,
      #    GHA artifact 已完全冗余;留着只会持续占用 Actions 存储配额(就是它把
      #    配额撑满卡了发布)。彻底去掉 → GitHub 上不再有 yuelink 构建产物。
      #    需要某次构建的二进制时,直接从 R2(yuelink-dist/<tag>/)取。


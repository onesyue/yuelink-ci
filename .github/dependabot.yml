version: 2

# Owner policy: no automatic Issues or PRs. Keep immutable action pins and
# dependency scanning; security-update PRs are separately disabled in settings.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    # 供应链冷却：Actions 以可重指的 tag 分发，冷却更长（安全更新不受此限）。
    cooldown:
      default-days: 7
    open-pull-requests-limit: 0
    commit-message:
      prefix: ci

